<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1f33"><meta name="description" content="Curso completo de percepção musical com treinamento auditivo, violão, harmonia e identificação de tonalidade."><title>Percepção Musical — Curso Completo</title><style>:root{--navy:#0b1f33;--navy2:#12395b;--blue:#1f6feb;--cyan:#0ea5a4;--gold:#f6c453;--orange:#ef8f3a;--red:#c94b4b;--green:#16846b;--bg:#f4f7fb;--card:#fff;--ink:#162b44;--muted:#63788d;--line:#dce5ee;--shadow:0 10px 28px rgba(11,31,51,.08);--radius:18px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:50;height:64px;background:rgba(11,31,51,.97);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-shadow:0 4px 18px rgba(0,0,0,.12)}.brand{font-weight:900;letter-spacing:.2px}.topright{display:flex;align-items:center;gap:10px;font-size:13px}.layout{display:flex;min-height:calc(100vh - 64px)}aside{width:270px;background:#fff;border-right:1px solid var(--line);position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto;padding:18px 14px}.main{width:min(1200px,100%);margin:auto;padding:28px}.nav-title{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.12em;margin:15px 8px 7px;text-transform:uppercase}.navbtn{display:block;width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:12px;color:var(--ink);margin:3px 0}.navbtn:hover,.navbtn.active{background:#edf4ff;color:var(--blue);font-weight:800}.navbtn small{color:var(--muted)}.hero{background:linear-gradient(135deg,var(--navy),#174a75 65%,#1f6feb);color:#fff;border-radius:24px;padding:32px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:'♫';position:absolute;right:28px;top:-55px;font-size:230px;opacity:.08}.hero h1{font-size:clamp(28px,4.2vw,48px);line-height:1.05;margin:0 0 12px;max-width:800px}.hero p{line-height:1.7;max-width:780px;color:#dceeff}.eyebrow{display:inline-flex;background:rgba(246,196,83,.18);color:#ffe9a6;border:1px solid rgba(246,196,83,.4);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:18px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 4px 18px rgba(11,31,51,.04)}.card h2,.card h3{margin-top:0}.muted{color:var(--muted)}.small{font-size:13px}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:#edf2f7;color:#5d7186;font-size:11px;font-weight:900}.pill.blue{background:#eaf2ff;color:#1f6feb}.pill.gold{background:#fff4cf;color:#8b6500}.pill.green{background:#e7f7f1;color:#11705c}.pill.red{background:#ffebeb;color:#a13a3a}.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--blue);color:#fff;font-weight:850;box-shadow:0 4px 12px rgba(31,111,235,.18)}.btn:hover{filter:brightness(.96)}.btn.secondary{background:#eaf2ff;color:var(--blue);box-shadow:none}.btn.gold{background:var(--gold);color:var(--navy)}.btn.green{background:var(--green)}.btn.dark{background:var(--navy)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.bar{height:10px;background:#e7edf3;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:999px}.score{font-size:36px;font-weight:950;color:var(--blue)}.section{margin-top:28px}.lesson{padding:16px 18px;border-left:5px solid var(--blue);background:#eff6ff;border-radius:12px;line-height:1.7;margin:14px 0}.lesson.gold{border-color:var(--gold);background:#fff9df}.lesson.green{border-color:var(--green);background:#eaf8f3}.lesson.red{border-color:var(--red);background:#fff0f0}.lesson h3{margin:0 0 7px}.prose{line-height:1.78;color:#334e68}.prose p{margin:9px 0}.prose ul{line-height:1.75}.topic{border-left:4px solid var(--blue);padding-left:14px}.topic strong{color:var(--navy)}.exercise{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}.exercise-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.exercise h2{margin:8px 0}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin:18px 0}.opt{padding:13px;border:2px solid var(--line);background:#fff;border-radius:12px;text-align:center;font-weight:750;color:var(--ink)}.opt:hover{border-color:var(--blue);background:#f5f9ff}.opt.correct{border-color:var(--green);background:#e8f8f1;color:#0b634f}.opt.wrong{border-color:var(--red);background:#fff0f0;color:#a13a3a}.answer{margin-top:14px}.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #eaf2ff}.select{padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff}.mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.metric{padding:15px;border:1px solid var(--line);border-radius:14px;background:#fbfdff}.metric b{font-size:20px}.locked{opacity:.58}.checklist label{display:flex;gap:10px;align-items:flex-start;margin:10px 0}.fretboard{background:#7d4f27;padding:16px;border-radius:18px;overflow:auto;box-shadow:inset 0 0 0 4px rgba(255,255,255,.08)}.fretrow{display:grid;grid-template-columns:55px repeat(13,68px);min-width:940px;height:42px}.fretrow>div{border-right:1px solid rgba(255,255,255,.35);border-bottom:1px solid rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;position:relative}.fretrow.header>div{border-bottom:0;color:#ffeec0}.nut{background:#eee!important;color:#333!important;font-weight:900}.dot{width:28px;height:28px;border-radius:50%;display:flex!important;background:var(--gold);color:var(--navy)!important;font-weight:950}.stringline{position:absolute;height:2px;background:rgba(255,255,255,.35);left:0;right:0;top:50%}.navnote{background:#e8f8f1!important;color:#0b6b54!important;font-weight:950}.footer{text-align:center;color:var(--muted);padding:35px 10px}.toast{position:fixed;right:18px;bottom:18px;background:var(--navy);color:#fff;padding:12px 15px;border-radius:12px;box-shadow:var(--shadow);z-index:100}.kbd{padding:2px 7px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:#fff;font-size:12px}.two{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.notice{font-size:12px;color:var(--muted);padding:10px 12px;background:#f6f9fc;border-radius:10px}.chapter-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.hidden{display:none!important}@media(max-width:980px){aside{display:none}.main{padding:18px}.grid4,.three,.two{grid-template-columns:1fr 1fr}}@media(max-width:600px){.top{padding:0 13px}.topright small{display:none}.main{padding:12px}.hero{padding:23px}.grid,.grid4,.three,.two{grid-template-columns:1fr}.card{padding:16px}.fretrow{grid-template-columns:45px repeat(13,58px);min-width:800px}}
</style></head><body><div id="app"></div><script>const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const solfege=['Do','Ré','Mi','Fá','Sol','Lá','Si'];
const VOL=[
{id:1,icon:'📘',title:'Fundamentos',range:'01–50',desc:'Aprenda a ouvir altura, pulso, repouso, tensão, tônica, audição interna e maior/menor.'},
{id:2,icon:'📗',title:'Tonalidade e Graus',range:'51–120',desc:'Construa o ouvido tonal: tônica, graus, notas de tendência, escalas, funções e confirmação do centro.'},
{id:3,icon:'📙',title:'Intervalos e Melodia',range:'121–180',desc:'Reconheça distâncias, direção, contorno, solfejo relativo, memória e ditado melódico.'},
{id:4,icon:'📕',title:'Acordes e Harmonia',range:'181–260',desc:'Ouça qualidade, baixo, inversões, funções, progressões, sétimas, guide tones e tensão.'},
{id:5,icon:'📒',title:'Descobrindo Músicas de Ouvido',range:'261–320',desc:'Aplique tudo para encontrar tom de cantores, acordes, capo, transposição, baixo e modulação.'},
{id:6,icon:'🏆',title:'Testes Finais',range:'',desc:'Diagnóstico por habilidade, provas progressivas e desafio final.'}
];
const START=[1,51,121,181,261], END=[50,120,180,260,320];
const LESSONS={
1:[
['1. O ouvido como instrumento','Treinamento auditivo não é decorar respostas. É construir uma ligação entre o que você escuta, o que imagina e o que consegue produzir. Antes de procurar uma nota no violão, tente descrevê-la: está mais alta ou mais baixa? soa estável ou instável? quer subir ou descer?','Regra de ouro: primeiro ouça, depois cante, por último procure no instrumento.'],
['2. Altura, intensidade e timbre','Altura é a percepção de grave/agudo ligada à frequência. Intensidade é força/volume. Timbre é a identidade sonora. Um cantor pode estar mais forte sem estar mais agudo. Separar essas dimensões evita muitos falsos “tons”.','Faça comparações em volume baixo e médio para não confundir força com altura.'],
['3. Repouso e tensão','Em música tonal, algumas notas parecem repousar e outras criam expectativa. A sensação de “casa” é o ponto de partida para descobrir a tônica. Não confunda a nota mais repetida com a tônica: a função depende do contexto.','Tente cantar uma nota e depois perguntar: consigo terminar a frase nela sem sentir que falta algo?'],
['4. Encontrando a tônica','A tônica é o centro tonal. Para encontrá-la, procure a nota que faz o trecho parecer completo quando você retorna a ela. Use finais de frases, notas longas, baixo e acordes de repouso como pistas.','No aplicativo, repita o áudio e tente cantar a “casa” antes de ver as alternativas.'],
['5. Audição interna','Audição interna é imaginar um som sem que ele esteja tocando. Ela transforma a memória em ferramenta. Cante Do–Mi–Sol e tente imaginar Do antes de ouvi-lo. Depois compare sua previsão com o áudio.','Se você não consegue imaginar uma nota, volte para uma referência curta e aumente gradualmente a distância.'],
['6. Maior e menor','Maior e menor não devem ser reduzidos a “feliz” e “triste”. A diferença estrutural mais importante está na terça: maior tem terça maior; menor, terça menor. Treine a cor do acorde e depois confirme pela terça.','Use a mesma tônica em exemplos maior/menor para perceber a mudança sem trocar o centro.']
],
2:[
['1. Tônica e centro tonal','A tonalidade é uma organização em torno de um centro. O nome do tom vem da tônica e do modo: G maior, E menor etc. Pensar em graus relativos é mais eficiente que decorar todas as notas isoladamente.','Sempre responda primeiro “onde está o I?” e só depois “qual é a nota?”.'],
['2. Graus I–VII','Os graus descrevem a posição relativa de cada nota. I é a casa; II e IV frequentemente criam movimento; V tem forte função dominante; VII tende a resolver para I.','Cante a escala e pare em cada grau. Observe como cada parada muda a sensação de estabilidade.'],
['3. Notas de tendência','Em tonalidade maior, VII tende a I e IV tende a III. Em contextos harmônicos, essas tendências ajudam a localizar a tônica mesmo quando ela não está evidente.','Treine 7→1 e 4→3 em várias tonalidades, sem depender do nome absoluto.'],
['4. Escala maior','A escala maior segue a sequência de tons e semitons T–T–S–T–T–T–S. Ao transportar a mesma estrutura, a função dos graus permanece, mesmo mudando as notas.','Memorize a sensação dos graus, não apenas a sequência de letras.'],
['5. Menor natural, harmônica e melódica','A menor natural tem b3, b6 e b7 em relação à maior. A harmônica eleva o 7º grau; a melódica tradicional eleva 6º e 7º na subida. Essas alterações mudam a cor e as tendências.','Comece pela menor natural e só depois compare as outras duas.'],
['6. I–IV–V e ii–V–I','I–IV–V aparece em inúmeros estilos e é excelente para treinar função. ii–V–I é um dos movimentos harmônicos mais importantes e reforça a chegada ao I.','Ouça primeiro o baixo e depois a qualidade do acorde.'],
['7. Tons relativos','C maior e A menor usam as mesmas notas, mas têm centros diferentes. O relativo é encontrado três semitons abaixo da tônica maior ou três acima da tônica menor.','Não confunda conjunto de notas com centro tonal.'],
['8. Transposição','Uma progressão pode ser deslocada inteira para outra tonalidade sem mudar suas relações. O ouvido deve reconhecer a função mesmo quando o nome absoluto muda.','Treine I–V–vi–IV em pelo menos 6 tonalidades.']
],
3:[
['1. Intervalo é relação','Intervalo é a distância entre duas alturas. Para percepção, treine primeiro direção (subindo/descendo), depois tamanho e qualidade.','Cante a nota inicial, produza a segunda e volte à primeira.'],
['2. Âncoras de intervalo','Alguns intervalos ficam mais fáceis quando ligados a músicas ou sílabas, mas não dependa apenas de uma música: combine referência, solfejo e função.','Crie duas referências pessoais para 3ª maior, 3ª menor, 4ª e 5ª.'],
['3. Contorno melódico','Antes de nomear notas, desenhe mentalmente o caminho: sobe, desce, repete, salta. O contorno reduz a complexidade de uma melodia longa.','Em ditados, registre primeiro o contorno e o ritmo aproximado.'],
['4. Solfejo móvel','No sistema móvel, Do representa a tônica da tonalidade. Isso fortalece a audição funcional porque você aprende “onde a nota está” em relação à casa.','Cante Do–Re–Mi em várias tonalidades, mantendo a mesma função.'],
['5. Memória auditiva','Memória musical melhora com blocos curtos. Ouça 2–4 notas, repita mentalmente, cante e só então tente registrar.','Aumente o tamanho do bloco apenas quando a taxa de acerto estiver alta.'],
['6. Ditado melódico','O processo recomendado é: identificar tonalidade → marcar pulso → ouvir contorno → encontrar graus → conferir ritmo → cantar a resposta.','Não tente escrever tudo de uma vez. O ditado é resolução de problemas.']
],
4:[
['1. Tríades','Uma tríade é formada por fundamental, terça e quinta. Maior = 1–3–5; menor = 1–b3–5; diminuto = 1–b3–b5; aumentado = 1–3–#5.','Primeiro identifique maior/menor; depois treine diminuto/aumentado.'],
['2. Baixo e inversões','O baixo revela muito da harmonia. Uma tríade invertida mantém as mesmas notas, mas troca a nota grave. Ouça o baixo separadamente antes de tentar nomear o acorde completo.','Pergunte: “qual nota está embaixo?” e só então “qual acorde?”.'],
['3. Funções harmônicas','Tônica = repouso. Predominante = preparação. Dominante = tensão que pede resolução. Essa leitura funcional é mais poderosa que decorar progressões como listas.','Cante a tônica durante a progressão e observe quando a tensão aumenta e relaxa.'],
['4. Sétimas e guide tones','A 3ª e a 7ª são guide tones importantes porque definem a qualidade e o movimento de muitos acordes. Em progressões, ouvir essas notas reduz a quantidade de informação necessária.','Treine 3ª e 7ª em ii–V–I.'],
['5. Progressões','Comece com I–IV–V, depois I–V–vi–IV, ii–V–I e progressões diatônicas. O objetivo é reconhecer função e movimento, não apenas decorar nomes.','Ouça baixo, função e qualidade em três passagens separadas.'],
['6. Dominantes secundárias','Um dominante secundário cria uma breve atração para um grau que não é o I. O ouvido percebe a intensificação de tensão e a resolução local.','Primeiro domine V→I; depois procure V/V, V/ii e outros movimentos.'],
['7. Relação melodia–harmonia','A melodia frequentemente destaca notas do acorde ou tensões controladas. Se você sabe a tonalidade e o grau da melodia, o conjunto de acordes possíveis diminui.','Ouça uma frase e pergunte quais notas parecem “pertencer” ao acorde de repouso.'],
['8. Transcrição harmônica','Divida a tarefa: tônica → baixo → qualidade → função → inversão → detalhes. Isso evita tentar adivinhar o acorde inteiro de uma vez.','Registre primeiro uma versão funcional; refine os nomes depois.']
],
5:[
['1. Protocolo de 30 segundos','Quando alguém canta, não comece caçando notas. Primeiro procure a casa; depois determine maior/menor; então encontre a tônica no violão e confirme com final, baixo ou I–IV–V.','O protocolo reduz tentativas aleatórias e transforma a descoberta em procedimento.'],
['2. Última nota e final','A última nota ou acorde frequentemente revela o centro, mas não é prova absoluta. Finais suspensos, dominantes e melodias que terminam em outros graus podem enganar.','Use o final como pista forte, nunca como regra única.'],
['3. Baixo como mapa','Se você consegue ouvir a fundamental no baixo, pode testar a relação dela com a tônica. O baixo também ajuda a detectar inversões.','Cante a tônica enquanto segue o baixo. Observe quais notas soam como I, IV e V.'],
['4. Maior ou menor','Depois de localizar a tônica, compare a terça. Se a terça estiver um semitom mais alta que a terça menor, você está diante da maior.','Não decida maior/menor apenas pelo “clima”. Procure evidência na terça e no acorde.'],
['5. Confirmando no violão','Ache a tônica em mais de uma corda. Toque I e depois V/IV. Se o acompanhamento encaixar sem esforço, sua hipótese ganha força.','Nunca use o braço como loteria: cante a nota antes de tocar.'],
['6. Capotraste','Capotraste muda a altura real sem necessariamente mudar as formas dos acordes. O ouvido deve descobrir o tom sonoro, não apenas o formato tocado.','Separe “acorde desenhado” de “acorde que soa”.'],
['7. Transposição','Depois de descobrir o tom, mova a música para outra tonalidade. Se a função continuar igual, você entendeu a estrutura e não apenas decorou notas.','Transponha uma progressão simples para 3 tonalidades.'],
['8. Modulação','Modulação é mudança de centro tonal. Procure uma nova sensação de casa, alterações cromáticas e acordes que passem a ter outra função.','Não declare modulação só porque apareceu uma nota fora da escala.'],
['9. Cantor começando fora da tônica','A primeira nota cantada quase nunca precisa ser a tônica. A habilidade é ouvir a relação dela com o centro.','Use a melodia inteira e principalmente o repouso final.'],
['10. Projeto de música','Para cada música: escreva tom, modo, primeira nota, última nota, baixo, progressão provável e pontos de dúvida. Depois confirme no violão.','A documentação dos erros acelera a evolução.']
]
};
const TOPICS=LESSONS;
let state=JSON.parse(localStorage.getItem('pm_state_v2')||'null')||{done:{},attempts:0,correct:0,streak:0,lastDay:null,favorites:[],recent:[],volume:1,view:'home',settings:{sound:'piano',tempo:76}};
function save(){localStorage.setItem('pm_state_v2',JSON.stringify(state))}
function pct(){return Math.round(Object.keys(state.done).length/320*100)}
function range(v){return [START[v-1],END[v-1]]}
function vFor(n){return n<=50?1:n<=120?2:n<=180?3:n<=260?4:5}
function pad(n){return String(n).padStart(3,'0')}
function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
function shell(content){document.getElementById('app').innerHTML=`<div class="top"><div class="brand">🎵 Percepção Musical</div><div class="topright"><span>${pct()}%</span><button class="btn gold" onclick="home()">⌂</button></div></div><div class="layout">${sidebar()}<main class="main">${content}<div class="footer">Curso local • progresso salvo neste dispositivo • sem necessidade de procurar pastas</div></main></div>`}
function sidebar(){return `<aside><div class="pill blue">CURSO COMPLETO</div><div class="nav-title">Aprender</div>${VOL.map(v=>`<button class="navbtn ${state.volume===v.id&&state.view==='volume'?'active':''}" onclick="openVolume(${v.id})">${v.icon} Volume ${v.id}<br><small>${v.title}${v.range?' · '+v.range:''}</small></button>`).join('')}<div class="nav-title">Ferramentas</div><button class="navbtn" onclick="training()">🎧 Treino rápido</button><button class="navbtn" onclick="daily()">📅 Treino de hoje</button><button class="navbtn" onclick="guitar()">🎸 Laboratório do violão</button><button class="navbtn" onclick="tests()">🏆 Testes finais</button><button class="navbtn" onclick="progress()">📊 Meu progresso</button><button class="navbtn" onclick="about()">ℹ️ Como estudar</button></aside>`}
function home(){state.view='home';save();let next=Object.keys(state.done).map(Number).find(n=>!state.done[n])||1;let acc=state.attempts?Math.round(state.correct/state.attempts*100):0;shell(`<section class="hero"><span class="eyebrow">Curso completo • 320 exercícios</span><h1>Treine o ouvido até conseguir ouvir a música por dentro.</h1><p>Um percurso organizado para sair do “vou testar acordes no violão” e chegar a um processo consciente: encontrar a casa, reconhecer graus, ouvir intervalos, identificar acordes e descobrir o tom de quem está cantando.</p><div class="actions"><button class="btn gold" onclick="exercise(${next})">▶ Continuar de onde parei</button><button class="btn secondary" onclick="daily()">📅 Treino de hoje</button></div></section><div class="grid4 section"><div class="metric"><span class="muted small">Progresso</span><br><b>${pct()}%</b></div><div class="metric"><span class="muted small">Exercícios</span><br><b>${Object.keys(state.done).length}/320</b></div><div class="metric"><span class="muted small">Acerto</span><br><b>${acc}%</b></div><div class="metric"><span class="muted small">Sequência</span><br><b>🔥 ${state.streak} dias</b></div></div><section class="section"><div class="two"><div class="card"><h2>🎯 O objetivo principal</h2><div class="prose"><p>Ouvir uma pessoa cantando e conseguir chegar à tonalidade com segurança.</p><p><b>Ouvir → cantar → encontrar a casa → testar maior/menor → confirmar → nomear.</b></p></div><button class="btn" onclick="openVolume(5)">Ir para o Volume 5</button></div><div class="card"><h2>🧭 Seu próximo passo</h2><p class="muted">${next<=320?'Exercício '+pad(next)+': '+exerciseTitle(next):'Curso concluído!'}</p><div class="bar"><i style="width:${pct()}%"></i></div><p class="small">Não pule etapas: percepção funcional se constrói por camadas.</p></div></div></section><section class="section"><h2>Trilha completa</h2><div class="grid">${VOL.slice(0,5).map(volumeCard).join('')}</div></section>`)}
function volumeCard(v){let [s,e]=range(v.id),done=Object.keys(state.done).filter(x=>+x>=s&&+x<=e).length;return `<div class="card"><span class="pill">${v.range}</span><h3>${v.icon} Volume ${v.id} — ${v.title}</h3><p class="muted">${v.desc}</p><div class="bar"><i style="width:${Math.round(done/(e-s+1)*100)}%"></i></div><p class="small">${done}/${e-s+1} exercícios</p><button class="btn secondary" onclick="openVolume(${v.id})">Abrir volume</button></div>`}
function openVolume(v){state.volume=v;state.view='volume';save();if(v===6){tests();return}let [s,e]=range(v);let lessons=LESSONS[v];shell(`<div class="hero"><span class="eyebrow">${VOL[v-1].range}</span><h1>${VOL[v-1].icon} Volume ${v} — ${VOL[v-1].title}</h1><p>${VOL[v-1].desc}</p></div><div class="lesson section"><h3>Como estudar este volume</h3><p>Leia uma lição curta, faça os exercícios sem olhar o gabarito, use a voz antes do violão e anote <b>por que</b> errou. A meta não é acertar por sorte; é reconhecer o padrão na próxima tentativa.</p></div><section class="section"><h2>Mapa de aprendizagem</h2><div class="grid">${lessons.map((l,i)=>`<article class="card"><span class="pill blue">Etapa ${i+1}</span><h3>${l[0]}</h3><p class="muted">${l[1]}</p><div class="lesson ${i%3===1?'gold':i%3===2?'green':''}"><b>Prática:</b> ${l[2]}</div><button class="btn" onclick="lesson(${v},${i})">Estudar + praticar</button></article>`).join('')}</div></section><section class="section"><div class="card"><h2>🔎 Biblioteca de exercícios</h2><p class="muted">Todos os exercícios deste volume ficam aqui. Pesquise por número, assunto ou palavra-chave.</p><input class="search" id="exSearch" placeholder="Ex.: tônica, maior, intervalo, baixo, modulação" oninput="filterEx(${s},${e})"><div id="exList">${exerciseList(s,e)}</div></div></section>`)}
function lesson(v,i){let l=LESSONS[v][i],s=START[v-1]+Math.floor(i*((END[v-1]-START[v-1]+1)/LESSONS[v].length));shell(`<div class="card"><span class="pill blue">Volume ${v} · Etapa ${i+1}</span><h1>${l[0]}</h1><div class="prose"><p>${l[1]}</p></div><div class="lesson gold"><h3>🧠 Como pensar</h3><p>${l[2]}</p></div><div class="lesson green"><h3>🎧 Treino recomendado</h3><p>Faça os exercícios a partir do ${pad(s)}. Tente cantar a resposta antes de tocar no violão. Se errar, descreva o erro em uma frase.</p></div><div class="actions"><button class="btn gold" onclick="exercise(${s})">▶ Começar exercício ${pad(s)}</button><button class="btn secondary" onclick="openVolume(${v})">← Voltar ao volume</button></div></div>`)}
function exerciseList(s,e){return Array.from({length:e-s+1},(_,i)=>{let n=s+i;return `<div class="exercise" data-ex="${n}" style="margin-top:12px"><div class="exercise-head"><div><span class="pill">${pad(n)}</span><h3>${exerciseTitle(n)}</h3></div><div>${state.done[n]?'<span class="pill green">✓ feito</span>':''}</div></div><p class="muted small">${exerciseInstruction(n)}</p><button class="btn secondary" onclick="exercise(${n})">▶ Abrir</button></div>`}).join('')}
function filterEx(s,e){let q=(document.getElementById('exSearch')?.value||'').toLowerCase();document.querySelectorAll('[data-ex]').forEach(x=>{let n=+x.dataset.ex;x.style.display=(!q||String(n).includes(q)||exerciseTitle(n).toLowerCase().includes(q)||exerciseInstruction(n).toLowerCase().includes(q))?'block':'none'})}
function exerciseTitle(n){if(n<=50)return ['Encontre a nota-casa','Repouso ou tensão?','Grave ou agudo?','Memória de uma nota','Eco melódico','Maior ou menor?','Qual nota voltou?','Ouça antes de procurar','Tônica pelo final','Cor do acorde'][n%10];if(n<=120)return ['Qual é a tônica?','Identifique o grau','7→1 ou 4→3?','I, IV ou V?','Maior ou menor','Confirme o centro','Tônica pelo final','Relativa maior/menor','Transponha a função','Escala maior'][n%10];if(n<=180)return ['Qual é o intervalo?','Subida ou descida?','Contorno melódico','Cante o grau','Complete a frase','Ditado curto','3ª maior ou menor?','4ª ou 5ª?','Memória de quatro notas','Solfejo móvel'][n%10];if(n<=260)return ['Tríade maior ou menor?','Qualidade do acorde','Fundamental ou inversão?','Ouça o baixo','I, IV ou V?','ii–V–I','Ouça a nota-guia','7ª maior ou dominante?','Diminuto?','Progressão harmônica'][n%10];return ['Descubra a tônica','Maior ou menor?','Ache a tonalidade no violão','Use a última nota','Use o baixo','Confirme com I–IV–V','Transponha','Há modulação?','Capotraste: tom real','Projeto de música'][n%10]}
function exerciseInstruction(n){if(n<=50)return 'Treine a escuta primária: altura, repouso, tensão, memória e cor maior/menor. Não toque o violão antes de formar uma hipótese.';if(n<=120)return 'Estabeleça o I mentalmente e responda em graus. O nome absoluto vem depois da função.';if(n<=180)return 'Descreva direção e contorno antes de nomear. Cante a nota inicial para criar uma âncora.';if(n<=260)return 'Separe baixo, qualidade e função. Não tente reconhecer o acorde inteiro como um único bloco.';return 'Aplique o protocolo de descoberta de tom: casa → modo → tônica no violão → confirmação → registro.'}
function qData(n){let v=vFor(n),seed=(n*17+3)%12,key=N[seed],type=v===1?'tonic':v===2?'degree':v===3?'interval':v===4?'chord':'key';let answer,options; if(type==='tonic'||type==='key'){answer=key;options=[...N].sort(()=>0.5-Math.random()).slice(0,7);if(!options.includes(answer))options[0]=answer}else if(type==='degree'){answer=['I','II','III','IV','V','VI','VII'][n%7];options=['I','II','III','IV','V','VI','VII']}else if(type==='interval'){answer=['2ª menor','2ª maior','3ª menor','3ª maior','4ª justa','5ª justa','6ª maior','7ª menor','oitava'][n%9];options=['2ª menor','2ª maior','3ª menor','3ª maior','4ª justa','5ª justa','6ª maior','7ª menor','oitava']}else{answer=['Maior','Menor','Diminuto','Aumentado'][n%4];options=['Maior','Menor','Diminuto','Aumentado']}return {v,type,key,answer,options}}
function exercise(n){state.recent=[n,...state.recent.filter(x=>x!==n)].slice(0,8);save();let q=qData(n);shell(`<div class="two"><div><div class="exercise"><span class="pill blue">Exercício ${pad(n)} · ${VOL[q.v-1].title}</span><h1>${exerciseTitle(n)}</h1><p class="prose">${exerciseInstruction(n)}</p><div class="lesson gold"><b>Antes de responder:</b> ouça pelo menos duas vezes. Na primeira, apenas absorva. Na segunda, tente cantar ou imaginar a resposta.</div><div class="actions"><button class="btn gold" onclick="playExercise(${n})">🔊 Ouvir exercício</button><button class="btn ghost" onclick="playExercise(${n},true)">🔁 Repetir</button><button class="btn secondary" onclick="toggleHint(${n})">💡 Dica</button></div><div id="hint" class="lesson hidden"><b>Dica:</b> ${hint(n,q)}</div><h3>Resposta</h3><div class="options">${q.options.map(o=>`<button class="opt" onclick="answer(${n},${JSON.stringify(o)},${JSON.stringify(q.answer)})">${o}</button>`).join('')}</div><div id="answerArea"></div></div></div><div><div class="card"><h3>🎯 Técnica</h3><p class="muted">${technique(n,q)}</p><div class="notice">Não avance só porque acertou. Tente explicar em uma frase por que a resposta faz sentido.</div></div><div class="card" style="margin-top:14px"><h3>📈 Seu histórico</h3><p class="small">Tentativas: ${state.attempts}</p><p class="small">Acertos: ${state.correct}</p><p class="small">Precisão: ${state.attempts?Math.round(state.correct/state.attempts*100):0}%</p></div></div></div>`);setTimeout(()=>playExercise(n),250)}
function hint(n,q){if(q.type==='tonic'||q.type==='key')return 'Procure a nota que funciona como “casa”. Se o trecho termina resolvendo, compare a última nota com essa sensação.';if(q.type==='degree')return 'Pense em Do como I. Pergunte qual posição a nota ocupa em relação à casa.';if(q.type==='interval')return 'Primeiro decida se sobe ou desce. Depois compare o tamanho do salto com suas referências.';return 'Ouça o caráter maior/menor e, se possível, siga a nota mais grave.'}
function technique(n,q){if(q.type==='tonic'||q.type==='key')return 'Tônica → cantar a casa → localizar no violão → testar I e V → confirmar no final. Este é o núcleo do Volume 5.';if(q.type==='degree')return 'Use solfejo móvel: não pense “qual letra?”, pense “qual função?”.';if(q.type==='interval')return 'Associe distância + direção + referência cantada. Evite depender exclusivamente de músicas de referência.';return 'Separe o problema: baixo → qualidade → função → inversão. Essa decomposição é muito mais confiável.'}
function toggleHint(n){document.getElementById('hint')?.classList.toggle('hidden')}
function answer(n,val,correct){let ok=val===correct;state.attempts++;if(ok)state.correct++;state.done[n]=ok?'correct':'attempted';save();document.querySelectorAll('.opt').forEach(b=>{if(b.textContent===correct)b.classList.add('correct');if(b.textContent===val&&!ok)b.classList.add('wrong')});let a=document.getElementById('answerArea');a.innerHTML=`<div class="lesson ${ok?'green':'red'}"><h3>${ok?'🎉 Correto':'🔎 Ainda não'}</h3><p>Resposta: <b>${correct}</b></p><p>${explain(n,correct,ok)}</p>${!ok?'<button class="btn secondary" onclick="playExercise('+n+')">🔊 Ouvir novamente</button>':''}</div><div class="actions"><button class="btn" onclick="exercise(${Math.min(n+1,320)})">Próximo exercício →</button><button class="btn secondary" onclick="openVolume(${vFor(n)})">Voltar ao volume</button></div>`;toast(ok?'Acerto registrado!':'Erro registrado — revise e repita.')}
function explain(n,c,ok){let q=qData(n);if(q.type==='tonic'||q.type==='key')return 'A resposta representa o centro tonal usado neste exercício. A habilidade treinada é reconhecer a “casa” pelo contexto, não pela primeira nota.';if(q.type==='degree')return 'Graus são posições relativas ao centro. Cantar a tônica e depois comparar a distância torna a identificação mais estável.';if(q.type==='interval')return 'O intervalo é a distância entre as duas alturas. O treino deve começar pela direção e terminar na qualidade/tamanho.';return 'A qualidade do acorde altera a terça e/ou quinta. Em etapas avançadas você combinará qualidade com baixo e função harmônica.'}
function midi(note){let i=N.indexOf(note);return 60+i}
function hz(m){return 440*Math.pow(2,(m-69)/12)}
function audio(){let AC=window.AudioContext||window.webkitAudioContext;if(!window._ac)window._ac=new AC();if(window._ac.state==='suspended')window._ac.resume();return window._ac}
function tone(note,dur=.7,start=0,type='sine',gain=.09){let ac=audio(),o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=hz(note);g.gain.setValueAtTime(0.0001,ac.currentTime+start);g.gain.exponentialRampToValueAtTime(gain,ac.currentTime+start+.02);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+start+dur);o.connect(g).connect(ac.destination);o.start(ac.currentTime+start);o.stop(ac.currentTime+start+dur+.03)}
function chord(root,qual,start=0,dur=1.1){let r=midi(root),ints=qual==='Maior'?[0,4,7]:qual==='Menor'?[0,3,7]:qual==='Diminuto'?[0,3,6]:[0,4,8];ints.forEach((x,i)=>tone(rootToNote(r+x),dur,start,'triangle',.045))}
function rootToNote(m){return N[((m%12)+12)%12]}
function playExercise(n){let q=qData(n),root=q.key,base=midi(root),tempo=(state.settings.tempo||76)/60; if(q.type==='tonic'||q.type==='key'){tone(root,.9,0,'sine',.1);tone(root,.9,.95,'sine',.1);tone(root,.55,2.0,'triangle',.1)}else if(q.type==='degree'){let deg=['I','II','III','IV','V','VI','VII'].indexOf(q.answer);let intervals=[0,2,4,5,7,9,11];tone(root,.8,0);tone(rootToNote(base+intervals[deg]),.8,.9,'triangle',.09);tone(root,.7,1.8)}else if(q.type==='interval'){let ints=[1,2,3,4,5,7,9,10,12],iv=ints[n%ints.length];tone(root,.6,0);tone(rootToNote(base+iv),.8,.72,'triangle',.09);tone(root,.6,1.7)}else{let quals=['Maior','Menor','Diminuto','Aumentado'];let qual=q.answer;chord(root,qual,0);tone(root,.5,1.35);chord(root,qual,2.0)} }
function training(){let n=261+Math.floor(Math.random()*60);exercise(n)}
function daily(){let day=new Date().getDate();let nums=[];for(let i=0;i<10;i++)nums.push(1+((day*13+i*17)%320));shell(`<div class="hero"><span class="eyebrow">Treino de hoje</span><h1>15–25 minutos com propósito.</h1><p>Faça estes 10 exercícios. Se errar, repita o áudio e escreva mentalmente o motivo. O objetivo diário é melhorar a precisão, não apenas aumentar o contador.</p></div><div class="grid section">${nums.map(n=>`<div class="exercise"><span class="pill">${pad(n)}</span><h3>${exerciseTitle(n)}</h3><p class="muted small">${exerciseInstruction(n)}</p><button class="btn" onclick="exercise(${n})">Abrir</button></div>`).join('')}</div>`)}
function guitar(){shell(`<div class="card"><span class="pill green">Ferramenta prática</span><h1>🎸 Laboratório do Violão</h1><p class="prose">Use o braço para confirmar o que seu ouvido já suspeita. A afinação mostrada é padrão: 6ª E, 5ª A, 4ª D, 3ª G, 2ª B, 1ª E.</p><div class="actions"><select class="select" id="gnote" onchange="renderGuitar()">${N.map(x=>`<option>${x}</option>`).join('')}</select><button class="btn gold" onclick="playNote(document.getElementById('gnote').value)">🔊 Ouvir nota</button></div><div id="board" style="margin-top:18px"></div><div class="lesson gold"><b>Exercício:</b> escolha uma nota, ouça-a, cante-a, encontre três posições no braço e só depois confira visualmente.</div></div><div class="grid section"><div class="card"><h3>Mapa de estudo</h3><p>1ª etapa: notas naturais. 2ª: sustenidos/bemóis. 3ª: mesma nota em várias cordas. 4ª: encontrar a tônica de uma música sem caça aleatória.</p></div><div class="card"><h3>Regra do ouvido</h3><p>Se você consegue tocar uma nota, mas não consegue cantá-la antes, a habilidade ainda está dependendo demais do instrumento. Volte para a audição interna.</p></div></div>`);renderGuitar()}
function playNote(note){tone(note,1.1,0,'sine',.11)}
function renderGuitar(){let note=document.getElementById('gnote')?.value||'C',tuning=['E','A','D','G','B','E'];let html='<div class="fretboard"><div class="fretrow header"><div>corda</div>'+Array.from({length:13},(_,i)=>`<div>${i}</div>`).join('')+'</div>';tuning.forEach((s,si)=>{let row=`<div class="fretrow"><div class="nut">${si+1}<br>${s}</div>`;for(let f=0;f<=12;f++){let nn=N[(N.indexOf(s)+f)%12];row+=`<div>${f===0?'': '<span class="stringline"></span>'}${nn===note?`<span class="dot">${nn}</span>`:''}</div>`}row+='</div>';html+=row});html+='</div>';document.getElementById('board').innerHTML=html}
function progress(){let acc=state.attempts?Math.round(state.correct/state.attempts*100):0;let blocks=VOL.slice(0,5).map(v=>{let [s,e]=range(v.id),d=Object.keys(state.done).filter(n=>+n>=s&&+n<=e).length;return `<div class="metric"><span>${v.icon} ${v.title}</span><br><b>${Math.round(d/(e-s+1)*100)}%</b><div class="bar"><i style="width:${Math.round(d/(e-s+1)*100)}%"></i></div></div>`}).join('');shell(`<div class="hero"><span class="eyebrow">Seu painel</span><h1>📊 Progresso</h1><p>Observe onde você está forte e onde ainda precisa de repetição. O melhor indicador é a precisão consistente, não a velocidade.</p></div><div class="grid4 section"><div class="metric"><span>Exercícios</span><br><b>${Object.keys(state.done).length}/320</b></div><div class="metric"><span>Tentativas</span><br><b>${state.attempts}</b></div><div class="metric"><span>Precisão</span><br><b>${acc}%</b></div><div class="metric"><span>Sequência</span><br><b>🔥 ${state.streak}</b></div></div><div class="card section"><h2>Mapa de domínio</h2><div class="grid4">${blocks}</div></div><div class="two section"><div class="card"><h2>Erros recentes</h2>${state.recent.length?state.recent.map(n=>`<p><b>${pad(n)}</b> — ${exerciseTitle(n)} <button class="btn secondary" onclick="exercise(${n})">revisar</button></p>`).join(''):'<p class="muted">Ainda não há histórico. Comece pelo Volume 1.</p>'}</div><div class="card"><h2>Próxima recomendação</h2><p>${acc<65?'Volte para fundamentos e tônica.':acc<80?'Faça revisão de graus e intervalos.':'Avance para harmonia e descoberta de tonalidade.'}</p><button class="btn" onclick="daily()">Treino de hoje</button></div></div>`)}
function tests(){shell(`<div class="hero"><span class="eyebrow">Avaliação</span><h1>🏆 Testes finais</h1><p>Seis provas curtas para medir o que realmente ficou no ouvido. Cada teste tem 10 questões e não altera o progresso dos 320 exercícios.</p></div><div class="grid section">${['Tônica e centro tonal','Maior × menor','Intervalos','Acordes','Progressões','Descobrir o tom'].map((x,i)=>`<div class="card"><span class="pill gold">Teste ${i+1}</span><h3>${x}</h3><p class="muted">10 questões, resultado e recomendação.</p><button class="btn" onclick="runTest(${i})">Começar</button></div>`).join('')}</div>`)}
function runTest(i){let starts=[1,51,121,181,201,261],nums=Array.from({length:10},(_,j)=>starts[i]+j*2),idx=0,score=0;function next(){if(idx>=nums.length){shell(`<div class="card"><span class="pill green">Resultado</span><h1>Teste concluído</h1><div class="score">${score}/10</div><p>${score>=9?'Excelente domínio.':score>=7?'Bom domínio; revise os erros.':'Repita as lições-base e tente novamente.'}</p><div class="actions"><button class="btn" onclick="tests()">Voltar</button><button class="btn secondary" onclick="progress()">Ver progresso</button></div></div>`);return}let n=nums[idx],q=qData(n);shell(`<div class="card"><span class="pill">Questão ${idx+1}/10</span><h1>${exerciseTitle(n)}</h1><button class="btn gold" onclick="playExercise(${n})">🔊 Ouvir</button><div class="options">${q.options.map(o=>`<button class="opt" onclick="${JSON.stringify(o)}===${JSON.stringify(q.answer)}?(score++,idx++,next()):(idx++,next())">${o}</button>`).join('')}</div></div>`)}next()}
function about(){shell(`<div class="hero"><span class="eyebrow">Método</span><h1>Como estudar este curso</h1><p>O curso foi pensado como uma escada: cada habilidade prepara a próxima.</p></div><div class="two section"><div class="card"><h2>Rotina de 20 minutos</h2><div class="prose"><p><b>5 min:</b> revisão de uma habilidade antiga.</p><p><b>10 min:</b> exercícios novos.</p><p><b>3 min:</b> cantar respostas e localizar no violão.</p><p><b>2 min:</b> registrar erros.</p></div></div><div class="card"><h2>Regra 70–80%</h2><p>Se você estiver abaixo disso em uma habilidade, não precisa “passar de fase”. Repita exercícios variados até a resposta ficar mais estável.</p></div></div><div class="card section"><h2>Princípios</h2><div class="grid"><div class="lesson"><b>Ouvido antes do instrumento.</b><br>O violão confirma; não deve adivinhar por você.</div><div class="lesson gold"><b>Função antes do nome.</b><br>Aprenda I, V, b3 etc. em relação à casa.</div><div class="lesson green"><b>Erro vira dado.</b><br>Registre o padrão do erro e repita a habilidade específica.</div></div></div>`)}
function boot(){home()}boot();
</script></body></html>
