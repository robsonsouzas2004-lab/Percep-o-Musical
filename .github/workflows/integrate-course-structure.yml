name: Integrar estrutura do curso
on:
  push:
    paths:
      - 'course-structure.js'
      - '.github/workflows/integrate-course-structure.yml'
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Integrar script no index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="course-structure.js"></script>'
          if tag not in s:
              s=s.replace('<script src="memory-test.js"></script>','<script src="memory-test.js"></script>'+tag)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit e limpar workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/integrate-course-structure.yml
          git commit -m 'Integra estrutura progressiva do curso' || exit 0
          git push
