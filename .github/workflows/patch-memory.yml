name: Patch memory test
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Aumenta teste de memorizacao para 12 notas') && !contains(github.event.head_commit.message, 'Remove workflow temporario de patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch 12 note options
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          patterns = [
              r'const\s+opts\s*=\s*\[\.\.\.Array\(\d+\)\.keys\(\)\]',
              r'const\s+opts\s*=\s*\[\.\.\.Array\(\d+\)\.keys\(\)\s*\]'
          ]
          for pat in patterns:
              if re.search(pat, s):
                  s2 = re.sub(pat, 'const opts=[...Array(12).keys()]', s, count=1)
                  if s2 != s:
                      s = s2
                      break
          else:
              raise SystemExit('Nao encontrei a lista de opcoes do teste de memorizacao.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Aumenta teste de memorizacao para 12 notas'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/patch-memory.yml
          git commit -m 'Remove workflow temporario de patch'
          git push
