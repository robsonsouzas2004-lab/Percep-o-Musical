<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120818"><title>Percep-O-Musical</title><style>:root{--bg:#09060d;--card:#17101f;--line:#392546;--text:#faf6ff;--muted:#b5a5bd;--pink:#ff4fd8;--purple:#9d6cff;--green:#53e0a5;--gold:#ffd166;--red:#ff6685}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#321044,#09060d 45%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.top{position:sticky;top:0;z-index:10;background:#09060dee;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.head{max-width:1000px;margin:auto;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--purple));color:#180b1e;font-size:22px;font-weight:900}.brand b{display:block}.brand small,.card p,.hero p,.mini{color:var(--muted)}.xp{color:var(--gold);font-weight:800}.wrap{max-width:1000px;margin:auto;padding:18px 14px 95px}.hero,.card{background:linear-gradient(160deg,#1b1125,#100a16);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:13px}.hero h1{font-size:31px;line-height:1.05;margin:8px 0}.eyebrow{color:var(--pink);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:900}.section{margin:23px 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:13px;padding:12px 15px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#16091b;font-weight:900;cursor:pointer}.btn.alt{background:#21152c;color:var(--text);border:1px solid #503666}.callout{padding:14px;border-left:4px solid var(--pink);background:#24112a;border-radius:12px;margin:13px 0;line-height:1.6}.callout.gold{border-left-color:var(--gold);background:#241c0d}.theory{font-size:16px;line-height:1.8}.theory h3{color:var(--pink)}.listen{width:100%;min-height:64px;border:1px solid #673b73;border-radius:17px;background:#24132b;color:#ffe9fb;font-weight:900;font-size:16px;cursor:pointer}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:15px 0}.choice{border:1px solid #493454;border-radius:14px;background:#18101f;color:var(--text);padding:14px 8px;font-weight:800;cursor:pointer}.choice.good{border-color:var(--green)}.choice.bad{border-color:var(--red)}.feedback{padding:14px;border-radius:14px;margin-top:10px;line-height:1.5}.ok{background:#0d2b22;border:1px solid #245f4b}.no{background:#32151f;border:1px solid #633043}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#110b18;border:1px solid var(--line);border-radius:15px;padding:12px}.stat b{display:block;font-size:22px}.memory{min-height:190px;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#39145a,#100a16 68%);border:1px solid #633d7b;border-radius:22px;padding:25px}.memory strong{font-size:44px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b0710ee;border-top:1px solid var(--line);z-index:20}.nav{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:none;border:0;color:#8e7e98;padding:9px 3px;font-size:10px}.nav b{display:block;font-size:18px}.nav .on{color:var(--pink)}.hide{display:none!important}.neck{overflow:auto;background:#120c17;border:1px solid var(--line);border-radius:16px;padding:14px}.strings{min-width:620px}.string{height:38px;border-bottom:1px solid #6b526f;position:relative;display:flex}.string:last-child{border-bottom:0}.fret{min-width:68px;border-right:1px solid #5b4262;display:grid;place-items:center;font-size:11px;color:#88788f;position:relative}.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--purple));color:#17091b;font-weight:900}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#2b1735;color:#e7c9ed;font-size:11px}@media(max-width:600px){.hero h1{font-size:26px}.wrap{padding-left:11px;padding-right:11px}}</style></head><body><header class="top"><div class="head"><div class="brand"><div class="logo">♪</div><div><b>Percep-O-Musical</b><small>Curso de percepção auditiva</small></div></div><div class="xp" id="xp">⚡ 0 XP</div></div></header><main class="wrap"><div id="app"></div></main><nav class="bottom"><div class="nav"><button data-page="home"><b>⌂</b>Início</button><button data-page="learn"><b>◈</b>Aprender</button><button data-page="memory"><b>🧠</b>Memória</button><button data-page="apply"><b>◎</b>Aplicar</button><button data-page="guitar"><b>♬</b>Violão</button></div></nav><script>'use strict';const N=['C','D','E','F','G','A','B'],F={C:261.63,D:293.66,E:329.63,F:349.23,G:392,A:440,B:493.88,Eb:311.13},P={C:'Dó',D:'Ré',E:'Mi',F:'Fá',G:'Sol',A:'Lá',B:'Si',Eb:'Mi♭'};let S=load(),page='home',seq=null,ctx=null;function fresh(){return{xp:0,attempts:0,correct:0,streak:0,memoryBest:0,memoryLevel:1,skills:{note:0,memory:0,tonic:0,minor:0}}}function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem('pom_v4')||'{}'))}catch(e){return fresh()}}function save(){localStorage.setItem('pom_v4',JSON.stringify(S));const el=document.getElementById('xp');if(el)el.textContent='⚡ '+S.xp+' XP'}function pct(){return S.attempts?Math.round(S.correct/S.attempts*100):0}async function audio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;ctx=ctx||new AC;if(ctx.state==='suspended')try{await ctx.resume()}catch(e){}return ctx}async function tone(n,d=.65,w=0){const c=await audio();if(!c)return;const o=c.createOscillator(),g=c.createGain(),now=c.currentTime+w;o.type='triangle';o.frequency.value=F[n];g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.15,now+.03);g.gain.exponentialRampToValueAtTime(.001,now+d);o.connect(g).connect(c.destination);o.start(now);o.stop(now+d+.03)}async function play(a){await audio();a.forEach((n,i)=>tone(n,.58,i*.68))}function shell(h){document.getElementById('app').innerHTML=h;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('on',x.dataset.page===page));save()}function home(){page='home';shell(`<section class="hero"><span class="eyebrow">Aprender → ouvir → entender → aplicar</span><h1>Seu ouvido pode ser treinado.</h1><p>Um curso para começar do zero e chegar ao ponto de ouvir uma música, encontrar a tonalidade e levar o que ouviu para o violão.</p><div class="row"><button class="btn" data-page="learn">▶ Começar</button><button class="btn alt" data-page="memory">🧠 Memória</button></div></section><div class="section"><h2>Seu painel</h2><div class="stats"><div class="stat"><b>${pct()}%</b><small>precisão</small></div><div class="stat"><b>${S.memoryBest}</b><small>melhor memória</small></div><div class="stat"><b>${S.streak}</b><small>sequência</small></div></div></div><div class="section"><h2>O caminho</h2><div class="grid"><article class="card"><h3>👂 Ouvir</h3><p>Grave/agudo, igual/diferente, direção e movimento.</p><button class="btn" data-topic="ouvir">Explorar</button></article><article class="card"><h3>🎵 Notas</h3><p>Comece com poucas alturas e construa o mapa auditivo.</p><button class="btn" data-topic="notas">Explorar</button></article><article class="card"><h3>🏠 Tônica</h3><p>Descubra a sensação de repouso e centro tonal.</p><button class="btn" data-topic="tonica">Explorar</button></article><article class="card"><h3>🎼 Harmonia</h3><p>Maior, menor, acordes, baixo e progressões.</p><button class="btn" data-topic="harmonia">Explorar</button></article></div></div><div class="callout gold"><b>Regra do curso:</b> nenhum exercício existe só para preencher quantidade. Cada tarefa treina uma habilidade específica.</div>`)}const T={ouvir:['Aprender a ouvir','Antes dos nomes, perceba. Um som pode ser mais grave, mais agudo, igual ou diferente de outro.','Isso é <b>altura</b>: a característica que organiza sons do grave ao agudo. O ouvido vem primeiro; o nome vem depois.',['C','G']],notas:['Descobrir as notas','Vamos construir um mapa pequeno e confiável antes de ampliar para todas as notas.','Dó, Ré, Mi, Fá, Sol, Lá e Si são nomes de alturas. Entre elas existem outras alturas, organizadas por semitons.',['C','D','E']],tonica:['Encontrar a casa','Algumas notas parecem repousar. Outras parecem pedir continuação. Essa sensação é uma porta para a tonalidade.','A <b>tônica</b> é o centro de referência da tonalidade, o grau 1. Ela pode não ser a primeira nota da música.',['G','E','C']],harmonia:['Entender acordes','Agora ouvimos várias alturas juntas. Primeiro compare a sensação; depois aprenda o nome.','Uma tríade possui fundamental, terça e quinta. C–E–G é maior; C–E♭–G é menor.',['C','E','G']]};function topic(id){const t=T[id]||T.ouvir;page='learn';shell(`<article class="card theory"><span class="eyebrow">Experiência → teoria → aplicação</span><h1>${t[0]}</h1><p>${t[1]}</p><div class="callout"><b>Ouça antes de ler a resposta.</b> Tente descrever a sensação com suas próprias palavras.</div><div class="row">${t[3].map(n=>`<button class="btn" onclick="tone('${n}')">🔊 ${P[n]}</button>`).join('')}</div><h3>A teoria entra agora</h3><p>${t[2]}</p><h3>Aplicação</h3><p>Essa mesma habilidade será reutilizada em melodia, tonalidade, intervalos, acordes e descoberta de músicas.</p><div class="callout gold"><b>Memória:</b> feche os olhos por alguns segundos e tente reproduzir mentalmente o som.</div><button class="btn" data-page="memory">🧠 Treinar memória</button></article>`)}function learn(){page='learn';shell(`<section class="hero"><span class="eyebrow">Teoria viva</span><h1>Primeiro você ouve. Depois entende.</h1><p>O curso foi pensado para quem nunca estudou teoria. Cada conceito nasce de uma experiência sonora, recebe um nome e volta para a prática.</p></section><div class="grid">${Object.keys(T).map(k=>`<article class="card"><span class="badge">CONCEITO</span><h3>${T[k][0]}</h3><p>${T[k][1]}</p><button class="btn" data-topic="${k}">Explorar</button></article>`).join('')}</div>`)}function memory(){page='memory';shell(`<section class="hero"><span class="eyebrow">Audição interna</span><h1>🧠 Memorização</h1><p>Você vai ouvir, silenciar e recuperar o som. O nível aumenta conforme seu desempenho.</p><span class="badge">Nível ${S.memoryLevel}</span></section><div class="grid"><article class="card"><h3>🎵 Nota</h3><p>Guarde uma nota e escolha entre quatro possibilidades.</p><button class="btn" onclick="memNote()">Começar</button></article><article class="card"><h3>🎶 Sequência</h3><p>Reconstrua uma sequência curta. O tamanho cresce com seu nível.</p><button class="btn" onclick="memSeq()">Começar</button></article><article class="card"><h3>↗️ Contorno</h3><p>Ignore os nomes e memorize apenas sobe/desce/repete.</p><button class="btn" onclick="memContour()">Começar</button></article></div><div id="mem"></div>`)}function opts(correct,pool){const a=[correct];pool.forEach(x=>{if(!a.includes(x))a.push(x)});while(a.length<4)a.push(N[Math.floor(Math.random()*7)]);return a.slice(0,4).sort(()=>Math.random()-.5)}function memoryUI(title,question,choices,answer){document.getElementById('mem').innerHTML=`<div class="card"><span class="eyebrow">${title}</span><div class="memory"><div><strong>🎧</strong><p>${question}</p></div></div><button class="btn alt" onclick="document.getElementById('memChoices').classList.remove('hide')">◌ Silenciar e responder</button><div id="memChoices" class="choices hide">${choices.map(x=>`<button class="choice" onclick="mAnswer('${x}','${answer}')">${x}</button>`).join('')}</div><div id="mfb"></div></div>`}function memNote(){const n=N[Math.floor(Math.random()*7)],choices=opts(P[n],N.map(x=>P[x]));seq=[n];memoryUI('Memória de uma nota','Ouça e tente guardar a altura. Depois silencie.',`<span></span>`.replace('x',''),n);document.querySelector('#mem .memory').insertAdjacentHTML('afterbegin',`<button class="listen" onclick="tone('${n}')">▶ Ouvir nota</button>`);const box=document.getElementById('memChoices');box.innerHTML=choices.map(x=>`<button class="choice" onclick="mAnswer('${x}','${P[n]}')">${x}</button>`).join('')}function memSeq(){const len=Math.min(2+Math.floor((S.memoryLevel-1)/2),5),a=Array.from({length:len},()=>N[Math.floor(Math.random()*7)]);seq=a;const correct=a.map(x=>P[x]).join(' → '),wrong1=a.map((x,i)=>P[N[(N.indexOf(x)+1)%7]]).join(' → '),wrong2=a.slice().reverse().map(x=>P[x]).join(' → '),wrong3=a.map(x=>P[N[Math.floor(Math.random()*7)]]).join(' → ');memoryUI('Memória de sequência','Reconstrua mentalmente a ordem depois de ouvir.',[correct,wrong1,wrong2,wrong3],correct);document.querySelector('#mem .memory').insertAdjacentHTML('afterbegin',`<button class="listen" onclick="play(seq)">▶ Ouvir sequência</button>`)}function memContour(){const patterns=['↑ ↑ ↓','↑ ↓ ↑','↓ ↑ ↑','↑ ↓ ↓'];const idx=Math.floor(Math.random()*patterns.length),pat=patterns[idx];const maps=[['C','E','D'],['C','E','C'],['E','C','G'],['G','E','C']];seq=maps[idx];memoryUI('Memória de contorno','Guarde apenas o desenho do movimento.',patterns,pat);document.querySelector('#mem .memory').insertAdjacentHTML('afterbegin',`<button class="listen" onclick="play(seq)">▶ Ouvir contorno</button>`)}function mAnswer(choice,correct){S.attempts++;const good=choice===correct;if(good){S.correct++;S.xp+=10;S.streak++;S.memoryLevel=Math.min(10,S.memoryLevel+1);S.memoryBest=Math.max(S.memoryBest,S.memoryLevel)}else{S.streak=0;S.memoryLevel=Math.max(1,S.memoryLevel-1)}save();document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===correct)b.classList.add('good');if(b.textContent===choice&&!good)b.classList.add('bad')});document.getElementById('mfb').innerHTML=`<div class="feedback ${good?'ok':'no'}"><b>${good?'✓ Muito bem!':'↺ Vamos reforçar.'}</b><br>${good?'Você recuperou a informação auditiva.':'A resposta correta estava marcada. Repita ouvindo com atenção ao movimento e tente novamente.'}</div>`}function apply(){page='apply';shell(`<section class="hero"><span class="eyebrow">Ouvido → aplicação</span><h1>Transforme percepção em música.</h1><p>Aqui você começa a usar o que ouviu em situações musicais reais.</p></section><article class="card"><h2>Maior × menor</h2><p>Compare a terça. Não tente decorar a aparência; ouça a diferença.</p><div class="row"><button class="btn" onclick="play(['C','E','G'])">▶ C maior</button><button class="btn alt" onclick="play(['C','Eb','G'])">▶ C menor</button></div><div class="callout">C–E–G = maior. C–E♭–G = menor. A terça muda: E → E♭.</div></article><article class="card"><h2>Intervalos</h2><p>Comece pela distância entre duas alturas.</p><div class="row"><button class="btn" onclick="play(['C','D'])">C → Ré</button><button class="btn" onclick="play(['C','G'])">C → Sol</button></div></article><article class="card"><h2>Descobrir o tom</h2><p>Importante: o cantor pode começar em qualquer grau. A primeira nota não define necessariamente a tonalidade.</p><button class="btn" onclick="challengeTonic()">🎤 Iniciar desafio</button><div id="challenge"></div></article>`)}function challengeTonic(){const tonic=N[Math.floor(Math.random()*7)],start=N[(N.indexOf(tonic)+2)%7];document.getElementById('challenge').innerHTML=`<div class="callout"><b>Situação:</b> o cantor começa em <b>${P[start]}</b>. Depois a música repousa claramente em <b>${P[tonic]}</b>.<br><br><b>Pergunta:</b> qual é a tônica?${N.map(n=>`<button class="choice" style="margin:4px" onclick="tonicAnswer('${n}','${tonic}')">${P[n]}</button>`).join('')}</div>`}function tonicAnswer(a,c){const good=a===c;S.attempts++;good?S.correct++:null;good?(S.xp+=15,S.streak++):(S.streak=0);save();document.getElementById('challenge').insertAdjacentHTML('beforeend',`<div class="feedback ${good?'ok':'no'}">${good?'✓ Exatamente. A nota inicial era outro grau.':'↺ Observe o repouso: a tônica é o centro, não necessariamente a primeira nota.'}</div>`)}function guitar(){page='guitar';shell(`<section class="hero"><span class="eyebrow">Laboratório de violão</span><h1>👂 Encontre o som no braço.</h1><p>Somente violão. O objetivo é conectar o ouvido ao instrumento.</p></section><article class="card"><h3>Escolha uma nota</h3><div class="row">${N.map(n=>`<button class="btn" onclick="tone('${n}');markGuitar('${n}')">${P[n]}</button>`).join('')}</div><div id="ginfo" class="callout">Ouça uma nota e depois procure a mesma altura no braço.</div></article><article class="card"><h3>Braço — afinação padrão</h3><div class="neck"><div class="strings">${['E','B','G','D','A','E'].map((s,i)=>`<div class="string">${[0,1,2,3,4,5,6,7].map(f=>`<div class="fret" data-string="${i}" data-fret="${f}">${f===0?s:f}</div>`).join('')}</div>`).join('')}</div></div><p class="mini">Nesta primeira base visual, use os números dos trastes como mapa. A próxima evolução poderá destacar automaticamente as ocorrências da nota ouvida.</p></article>`)}function markGuitar(n){document.getElementById('ginfo').innerHTML=`<div class="callout"><b>Alvo:</b> ${P[n]}<br>Agora tente localizar essa nota no violão antes de tocar qualquer outra.</div>`}document.addEventListener('click',e=>{const p=e.target.closest('[data-page]'),t=e.target.closest('[data-topic]');if(p){page=p.dataset.page;({home,learn,memory,apply,guitar})[page]()}if(t)topic(t.dataset.topic)});home();</script></body></html>
