<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b16"><title>Percep-O-Musical</title><style>:root{--bg:#070b16;--card:#10192b;--line:#263653;--text:#f4f7ff;--muted:#9ba9c4;--cyan:#43e7ff;--violet:#9b7bff;--green:#50e3a4;--gold:#ffd166;--red:#ff6685}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#18265a,#070b16 42%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.top{position:sticky;top:0;z-index:10;background:#070b16ee;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.head{max-width:1000px;margin:auto;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#07101c;font-size:22px;font-weight:900}.brand b{display:block}.brand small,.card p,.hero p,.mini{color:var(--muted)}.xp{color:var(--gold);font-weight:800}.wrap{max-width:1000px;margin:auto;padding:18px 14px 95px}.hero,.card{background:linear-gradient(160deg,#111c32,#0b1220);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:13px}.hero h1{font-size:31px;line-height:1.05;margin:8px 0}.eyebrow{color:var(--cyan);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:900}.section{margin:23px 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:13px;padding:12px 15px;background:linear-gradient(135deg,var(--cyan),#75b9ff);color:#06101a;font-weight:900;cursor:pointer}.btn.alt{background:#17233a;color:var(--text);border:1px solid #30415f}.pill,.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:11px}.callout{padding:14px;border-left:4px solid var(--cyan);background:#0c2030;border-radius:12px;margin:13px 0;line-height:1.6}.callout.gold{border-left-color:var(--gold);background:#211b0b}.theory{font-size:16px;line-height:1.8}.theory h3{color:var(--cyan)}.listen{width:100%;min-height:64px;border:1px solid #31536c;border-radius:17px;background:#0b2633;color:#e2fbff;font-weight:900;font-size:16px;cursor:pointer}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin:15px 0}.choice{border:1px solid #2b3b57;border-radius:14px;background:#111b2d;color:var(--text);padding:14px 8px;font-weight:800;cursor:pointer}.choice.good{border-color:var(--green)}.choice.bad{border-color:var(--red)}.feedback{padding:14px;border-radius:14px;margin-top:10px;line-height:1.5}.ok{background:#0d2b22;border:1px solid #245f4b}.no{background:#32151f;border:1px solid #633043}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0b1322;border:1px solid var(--line);border-radius:15px;padding:12px}.stat b{display:block;font-size:22px}.memory{min-height:190px;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#17295a,#0b1220 65%);border:1px solid #3b4d75;border-radius:22px;padding:25px}.memory strong{font-size:44px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#080d18ee;border-top:1px solid var(--line);z-index:20}.nav{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:none;border:0;color:#71809a;padding:9px 3px;font-size:10px}.nav b{display:block;font-size:18px}.nav .on{color:var(--cyan)}.hide{display:none!important}@media(max-width:600px){.hero h1{font-size:26px}.wrap{padding-left:11px;padding-right:11px}.nav button{font-size:9px}}</style></head><body><header class="top"><div class="head"><div class="brand"><div class="logo">♪</div><div><b>Percep-O-Musical</b><small>Curso de percepção auditiva</small></div></div><div class="xp" id="xp">⚡ 0 XP</div></div></header><main class="wrap"><div id="app"></div></main><nav class="bottom"><div class="nav"><button data-page="home"><b>⌂</b>Início</button><button data-page="learn"><b>◈</b>Aprender</button><button data-page="memory"><b>🧠</b>Memória</button><button data-page="apply"><b>◎</b>Aplicar</button><button data-page="guitar"><b>♬</b>Violão</button></div></nav><script>'use strict';
const N=['C','D','E','F','G','A','B'],F={C:261.63,D:293.66,E:329.63,F:349.23,G:392,A:440,B:493.88},P={C:'Dó',D:'Ré',E:'Mi',F:'Fá',G:'Sol',A:'Lá',B:'Si'};let S=load(),page='home',seq=null,ctx=null;
function load(){try{return JSON.parse(localStorage.getItem('pom_v3'))||B()}catch(e){return B()}}function B(){return{xp:0,attempts:0,correct:0,streak:0,memoryBest:0,memoryLevel:1}}function save(){localStorage.setItem('pom_v3',JSON.stringify(S));xp.textContent='⚡ '+S.xp+' XP'}function pct(){return S.attempts?Math.round(S.correct/S.attempts*100):0}function shell(h){app.innerHTML=h;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('on',x.dataset.page===page));save()}
function tone(n,d=.65,w=0){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=F[n];g.gain.setValueAtTime(.001,ctx.currentTime+w);g.gain.exponentialRampToValueAtTime(.16,ctx.currentTime+w+.03);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+w+d);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+w);o.stop(ctx.currentTime+w+d+.02)}function play(a){a.forEach((n,i)=>tone(n,.6,i*.72))}
function home(){page='home';shell(`<section class="hero"><span class="eyebrow">Aprender → ouvir → entender → aplicar</span><h1>Seu ouvido pode ser treinado.</h1><p>Para quem nunca estudou música: a experiência vem primeiro, a teoria aparece aos poucos e a prática transforma o conceito em habilidade.</p><div class="row"><button class="btn" data-page="learn">▶ Começar a descobrir</button><button class="btn alt" data-page="memory">🧠 Treinar memória</button></div></section><div class="section"><h2>Seu painel</h2><div class="stats"><div class="stat"><b>${pct()}%</b><small>precisão</small></div><div class="stat"><b>${S.memoryBest}</b><small>melhor memória</small></div><div class="stat"><b>${S.streak}</b><small>sequência</small></div></div></div><div class="section"><h2>O mundo musical</h2><div class="grid"><article class="card"><h3>👂 Aprender a ouvir</h3><p>Grave/agudo, igual/diferente, direção, repouso e movimento.</p><button class="btn" data-topic="ouvir">Explorar</button></article><article class="card"><h3>🎵 Notas e teoria</h3><p>Descubra notas, tons, semitons, escalas e graus sem decorar tudo de uma vez.</p><button class="btn" data-topic="notas">Explorar</button></article><article class="card"><h3>🏠 A sensação de casa</h3><p>Entenda tônica, tensão, resolução e tonalidade.</p><button class="btn" data-topic="tonica">Explorar</button></article><article class="card"><h3>🎼 Harmonia</h3><p>Tríades, maior/menor, baixo, inversões e progressões.</p><button class="btn" data-topic="harmonia">Explorar</button></article></div></div><div class="callout gold"><b>Filosofia:</b> Ouvi → reconheci → entendi → dei nome → memorizei → apliquei.</div>`)}
const T={ouvir:['Aprender a ouvir','Você já percebe música quando percebe que um som é mais grave, mais agudo, igual ou diferente. Isso já é percepção musical.','A característica que percebemos como grave/agudo chama-se <b>altura</b>. Primeiro desenvolvemos essa percepção; depois aprendemos os nomes.',['C','G']],notas:['Descobrir as notas','Notas são nomes usados para representar alturas. Vamos começar com poucas notas e aumentar o mapa somente quando o ouvido estiver pronto.','Na música ocidental usamos Dó, Ré, Mi, Fá, Sol, Lá e Si, além das alturas intermediárias. Teoria serve para organizar e comunicar o que o ouvido já percebe.',['C','D','E']],tonica:['Encontrar a casa','Algumas notas parecem chegar; outras parecem pedir continuação. Essa sensação de repouso é uma das portas para entender tonalidade.','A <b>tônica</b> é o centro de referência da tonalidade, o grau 1. Ela não precisa ser a primeira nota de uma música.',['G','E','C']],harmonia:['Entender acordes','Agora vamos ouvir várias notas juntas. Compare as duas sonoridades e descreva primeiro o que sente.','Um acorde combina alturas. Nas tríades maior e menor, a relação da fundamental com a terça é decisiva para a qualidade do acorde.',['C','E','G']]};
function topic(id){let t=T[id]||T.ouvir;page='learn';shell(`<article class="card theory"><span class="eyebrow">Experiência → teoria → aplicação</span><h1>${t[0]}</h1><p>${t[1]}</p><div class="callout"><b>Agora ouça.</b> Não tente decorar. Perceba o que muda.</div><div class="row">${t[3].map(n=>`<button class="btn" onclick="tone('${n}')">🔊 ${P[n]}</button>`).join('')}</div><h3>A teoria entra agora</h3><p>${t[2]}</p><h3>Por que isso importa?</h3><p>Mais tarde esta mesma habilidade será usada para cantar, reconhecer melodias, descobrir o tom e localizar sons no violão.</p><div class="callout gold"><b>Memorize:</b> feche os olhos por alguns segundos e tente lembrar a sensação sonora que acabou de ouvir.</div><button class="btn" data-page="memory">🧠 Levar para a memória</button></article>`)}
function learn(){page='learn';shell(`<section class="hero"><span class="eyebrow">Teoria viva</span><h1>Não é uma apostila. É uma descoberta.</h1><p>Você pode entrar por qualquer assunto. Cada conceito começa com uma experiência, recebe uma explicação teórica e termina conectado à música real.</p></section><div class="grid">${Object.keys(T).map(k=>`<article class="card"><span class="pill">CONCEITO</span><h3>${T[k][0]}</h3><p>${T[k][1]}</p><button class="btn" data-topic="${k}">Explorar</button></article>`).join('')}</div><div class="card theory"><h3>Como a teoria vai crescer</h3><p><b>Primeiro:</b> perceber.</p><p><b>Depois:</b> nomear.</p><p><b>Depois:</b> compreender a regra.</p><p><b>Depois:</b> usar em uma música.</p><p><b>Por fim:</b> ouvir e explicar sem depender da tela.</p></div>`)}
function memory(){page='memory';shell(`<section class="hero"><span class="eyebrow">Audição interna</span><h1>🧠 Memorização</h1><p>Memorizar não é decorar uma lista. É guardar uma sensação sonora e recuperá-la depois. Isso sustenta melodia, tonalidade, intervalos e harmonia.</p><span class="pill">Nível ${S.memoryLevel}</span></section><div class="grid"><article class="card"><h3>🎵 Memória de uma nota</h3><p>Ouça, espere e escolha qual som ficou na memória.</p><button class="btn" onclick="memNote()">Começar</button></article><article class="card"><h3>🎶 Memória de sequência</h3><p>Ouça uma pequena sequência e reconstrua o que ouviu.</p><button class="btn" onclick="memSeq()">Começar</button></article><article class="card"><h3>↗️ Contorno</h3><p>Memorize apenas o desenho: sobe, desce, repete.</p><button class="btn" onclick="memContour()">Começar</button></article></div><div id="mem"></div>`)}
function memNote(){let n=N[Math.floor(Math.random()*N.length)];seq=[n];memoryUI('Memória de uma nota',`<button class="listen" onclick="tone('${n}')">▶ Ouvir</button>`,`<button class="choice" onclick="mAnswer('${n}')">${P[n]}</button><button class="choice" onclick="mAnswer('${N[(N.indexOf(n)+2)%7]}')">Outra nota</button>`)}function memSeq(){let a=[N[Math.floor(Math.random()*7)],N[Math.floor(Math.random()*7)]];seq=a;memoryUI('Memória de sequência',`<button class="listen" onclick="play(seq)">▶ Ouvir sequência</button>`,`<button class="choice" onclick="mAnswer('${a.join('')}')">${a.map(x=>P[x]).join(' → ')}</button><button class="choice" onclick="mAnswer('x')">Outra sequência</button>`)}function memContour(){seq=['C','E','D'];memoryUI('Memória de contorno',`<button class="listen" onclick="play(seq)">▶ Ouvir</button>`,`<button class="choice" onclick="mAnswer('CED')">↑ ↑ ↓</button><button class="choice" onclick="mAnswer('x')">↑ ↓ ↑</button>`)}
function memoryUI(title,a,b){document.getElementById('mem').innerHTML=`<div class="card"><span class="eyebrow">${title}</span><div class="memory"><div><strong>🎧</strong><p>Ouça. Depois tente lembrar antes de responder.</p></div></div><div class="row">${a}<button class="btn alt" onclick="document.getElementById('memChoices').classList.remove('hide')">◌ Silenciar e responder</button></div><div id="memChoices" class="choices hide">${b}</div><div id="mf"></div></div>`}
function mAnswer(a){let target=seq.join(''),ok=a===target;S.attempts++;if(ok){S.correct++;S.xp+=10;S.streak++;S.memoryBest=Math.max(S.memoryBest,S.streak);if(S.streak%3===0)S.memoryLevel=Math.min(5,S.memoryLevel+1)}else S.streak=0;save();mf.innerHTML=`<div class="feedback ${ok?'ok':'no'}"><b>${ok?'Muito bem!':'Vamos de novo.'}</b> ${ok?'Você recuperou a informação sonora.':'Observe o que se perdeu: altura, ordem ou direção. O erro vira informação para o próximo treino.'}</div>`}
function apply(){page='apply';shell(`<section class="hero"><span class="eyebrow">Aplicação real</span><h1>🎤 Descobrir o tom</h1><p>O cantor pode começar em qualquer nota. Por isso, a primeira nota não é automaticamente o tom.</p></section><div class="card theory"><h3>O método</h3><p><b>1.</b> Procure onde a frase parece descansar.</p><p><b>2.</b> Cante essa sensação de “casa”.</p><p><b>3.</b> Encontre a nota no violão.</p><p><b>4.</b> Teste maior ou menor.</p><p><b>5.</b> Confirme em outro trecho.</p><div class="callout gold"><b>Ideia central:</b> o ouvido relativo reconhece relações e funções; por isso a mesma música continua reconhecível quando transposta.</div></div><div class="grid"><article class="card"><h3>🎼 Maior × menor</h3><p>Ouça a diferença sem olhar.</p><button class="btn" onclick="play(['C','E','G'])">▶ Maior</button><button class="btn alt" onclick="play(['C','D','G'])">▶ Comparar</button></article><article class="card"><h3>↕️ Intervalos</h3><p>Perceba distância antes de decorar o nome.</p><button class="btn" onclick="play(['C','D'])">Pequena</button><button class="btn alt" onclick="play(['C','G'])">Grande</button></article></div>`)}
function guitar(){page='guitar';shell(`<section class="hero"><span class="eyebrow">Aplicação no instrumento</span><h1>🎸 Ouvido → violão</h1><p>O instrumento entra como confirmação. Primeiro você ouve; depois encontra.</p></section><div class="card"><h3>Notas naturais</h3><div style="overflow:auto;background:#1b120d;padding:18px;border-radius:16px"><div style="min-width:720px;height:150px;background:linear-gradient(#704323,#b7783d,#744423);position:relative;border-radius:12px">${N.map((n,i)=>`<button class="choice" style="position:absolute;left:${8+i*12}%;top:55px" onclick="tone('${n}')">${n}</button>`).join('')}</div></div><p class="mini">Clique para ouvir e associe som, nome e posição. Depois vamos aumentar a complexidade.</p></div><div class="callout"><b>Capo e transposição:</b> o mesmo desenho pode produzir outra altura. O objetivo é reconhecer a relação musical, não decorar uma única posição.</div>`)}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){let v=p.dataset.page;if(v==='home')home();if(v==='learn')learn();if(v==='memory')memory();if(v==='apply')apply();if(v==='guitar')guitar()}let t=e.target.closest('[data-topic]');if(t)topic(t.dataset.topic)});home();</script></body></html>
