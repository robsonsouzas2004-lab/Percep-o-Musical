<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172554"><meta name="description" content="Curso completo de percepção musical"><title>Percepção Musical</title><style>
:root{--navy:#172554;--blue:#2563eb;--cyan:#0891b2;--gold:#d97706;--green:#15803d;--red:#dc2626;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#64748b;--line:#dbe3ef}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text);background:var(--bg)}button{font:inherit}.app{min-height:100vh}.top{background:linear-gradient(135deg,#172554,#1d4ed8);color:#fff;padding:20px 18px 18px;position:sticky;top:0;z-index:5;box-shadow:0 3px 15px #17255433}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:14px;background:#ffffff20;display:grid;place-items:center;font-size:25px}.brand h1{font-size:20px;margin:0}.brand p{margin:2px 0 0;color:#dbeafe;font-size:12px}.nav{display:flex;gap:8px;overflow:auto;margin-top:16px;padding-bottom:2px}.nav button{border:0;background:#ffffff16;color:#fff;border-radius:999px;padding:9px 13px;white-space:nowrap}.nav button.active{background:#fff;color:var(--navy);font-weight:700}.wrap{max-width:1050px;margin:auto;padding:18px 16px 90px}.hero{background:linear-gradient(135deg,#fff,#eff6ff);border:1px solid #dbeafe;border-radius:22px;padding:22px;margin-bottom:16px}.hero h2{font-size:27px;margin:0 0 8px;color:var(--navy)}.hero p{margin:0;color:#475569;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 2px 8px #17255408}.card h3{margin:0 0 7px;font-size:17px}.card p{color:var(--muted);line-height:1.5;margin:6px 0}.vol{border-left:5px solid var(--blue)}.vol.v2{border-color:#0891b2}.vol.v3{border-color:#7c3aed}.vol.v4{border-color:#d97706}.vol.v5{border-color:#dc2626}.vol.v6{border-color:#15803d}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--navy);color:#fff;cursor:pointer}.btn.alt{background:#e8eef8;color:var(--navy)}.btn.gold{background:#fff7ed;color:#9a3412}.btn.green{background:#dcfce7;color:#166534}.btn.red{background:#fee2e2;color:#991b1b}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.progress{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#2563eb,#0891b2);width:0}.stat{font-size:28px;font-weight:800;color:var(--navy)}.muted{color:var(--muted)}.section{margin:22px 0 10px}.section h2{font-size:22px;margin:0 0 9px;color:var(--navy)}.lesson{line-height:1.7}.lesson h3{color:var(--navy);margin-top:22px}.callout{background:#eff6ff;border-left:4px solid var(--blue);padding:13px 15px;border-radius:10px;margin:13px 0}.warning{background:#fff7ed;border-left:4px solid var(--gold)}.exercise{border:2px solid #dbeafe;background:#fff;border-radius:20px;padding:20px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin:15px 0}.choice{padding:13px;border:1px solid var(--line);background:#fff;border-radius:12px;text-align:left}.choice:hover{border-color:var(--blue);background:#eff6ff}.result{padding:13px;border-radius:12px;margin-top:12px}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.fret{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;margin:10px 0}.fret span{background:#f8fafc;border:1px solid #cbd5e1;min-height:34px;display:grid;place-items:center;font-size:11px}.fret .nut{background:#e2e8f0;font-weight:700}.note{background:#dbeafe!important;color:#1d4ed8;font-weight:800}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:13px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px}.tabs button.sel{background:var(--navy);color:#fff}.footer{text-align:center;color:#94a3b8;font-size:12px;padding:25px}.hide{display:none}@media(min-width:800px){.top{padding-left:calc((100% - 1050px)/2 + 16px);padding-right:calc((100% - 1050px)/2 + 16px)}}
</style></head><body><div id="app"></div><script>
const V=[
{id:1,title:'Fundamentos',range:'01–50',color:'v1',desc:'Como o ouvido percebe altura, repouso, tensão, pulsação, timbre e centro sonoro.',lessons:[['O que é percepção musical','Percepção musical é transformar som em informação: altura, direção, distância, função e contexto. O objetivo não é apenas reconhecer notas isoladas, mas entender o papel que cada som desempenha.'],['Repouso e tensão','Uma música cria movimento quando se afasta de um ponto de repouso e sensação de chegada quando retorna. Treine cantar uma nota estável e depois outra que peça resolução.'],['Tônica e “casa”','A tônica é o centro tonal. Não é necessariamente a primeira nota, a nota mais grave ou a nota mais frequente. Procure a sensação de casa: a nota para a qual a música poderia terminar.'],['Maior e menor','Compare a terça maior e a terça menor. A qualidade do acorde depende principalmente dessa distância em relação à tônica.'],['Rotina de 15 minutos','3 min de referência; 5 min de tônica; 4 min de canto; 3 min de registro dos erros.'] ]},
{id:2,title:'Tonalidade e Graus',range:'51–120',color:'v2',desc:'Centro tonal, escala maior/menor, graus, notas de tendência, solfejo móvel e progressões.',lessons:[['Centro tonal','Antes de nomear uma tonalidade, encontre o centro. Depois compare a nota encontrada com o violão.'],['Graus I–VII','Pense em função relativa: I repousa, V cria forte atração para I, VII tende a subir para I, IV prepara movimento e vi oferece repouso relativo.'],['Solfejo móvel','Use “Do” como tônica da tonalidade. Isso treina função em vez de depender do nome absoluto da nota.'],['Maior, menor natural, harmônica e melódica','Aprenda a ouvir a alteração do 6º e 7º graus. No menor harmônico, o 7º grau elevado cria forte atração para a tônica.'],['I–IV–V e ii–V–I','Treine primeiro o baixo, depois a qualidade do acorde e finalmente a função.'] ]},
{id:3,title:'Intervalos e Melodia',range:'121–180',color:'v3',desc:'Distância, direção, contorno, memória melódica, canto e ditado.',lessons:[['Intervalos','Intervalo é a distância entre duas alturas. Primeiro perceba direção e tamanho; depois nomeie a qualidade.'],['Referências','Use músicas e relações já dominadas como âncoras. Depois abandone a referência e reconheça a função diretamente.'],['Contorno melódico','Antes de identificar cada nota, desenhe mentalmente: sobe, desce, repete, salta, retorna. Isso reduz a carga de memória.'],['Ditado','Ouça várias vezes: pulso → centro → contorno → pontos de chegada → detalhes.'],['Audição interna','Cante mentalmente a tônica e antecipe a resolução antes de conferir no instrumento.'] ]},
{id:4,title:'Acordes e Harmonia',range:'181–260',color:'v4',desc:'Tríades, inversões, sétimas, baixo, funções, voicings e progressões.',lessons:[['Tríades','Maior = 1–3–5; menor = 1–b3–5; diminuta = 1–b3–b5; aumentada = 1–3–#5.'],['Inversões','A mesma tríade muda de sensação quando o baixo muda. Ouça o baixo separadamente e depois reconecte-o ao acorde.'],['Funções','Tônica, predominante e dominante formam uma gramática. I é centro; IV/ii afastam; V e vii° aumentam a tensão.'],['Acordes com 7ª','Ouça primeiro a terça e a sétima, depois o baixo. Guide tones ajudam a distinguir a função.'],['Harmonia avançada','Dominantes secundários, empréstimos modais e acordes de passagem devem ser estudados depois de dominar o diatônico.'] ]},
{id:5,title:'Descobrindo Músicas de Ouvido',range:'261–320',color:'v5',desc:'Aplicação prática: descobrir o tom de cantores, acordes, progressões, capo, transposição e modulação.',lessons:[['Protocolo de 30 segundos','1) encontre a casa; 2) cante a tônica; 3) ache no violão; 4) teste maior/menor; 5) confirme com I/IV/V; 6) confira a nota final.'],['Cantor começando fora da tônica','A primeira nota pode ser III, V, VI etc. Não confunda nota inicial com tonalidade.'],['Baixo como pista','A linha de baixo frequentemente revela a raiz ou o movimento funcional. Ouça as notas de chegada antes das notas de passagem.'],['Capotraste e transposição','O tom que você ouve é independente da posição física dos acordes. Capo desloca as alturas reais.'],['Modulação','Quando a sensação de casa muda de forma persistente, procure novo centro e novas relações.'] ]},
{id:6,title:'Testes Finais e Gabaritos',range:'Final',color:'v6',desc:'Diagnóstico completo e desafios mistos para verificar se a habilidade está funcional.',lessons:[['Teste de tônica','Mistura de centros claros, notas iniciais enganosas e finais ambíguos.'],['Teste de intervalos','Reconhecimento ascendente e descendente com diferentes registros.'],['Teste harmônico','Tríades, inversões, sétimas e progressões.'],['Teste de tonalidade','Você deverá encontrar a casa e então confirmar o tom.'],['Desafio final','Análise completa: centro, maior/menor, graus, baixo, acordes prováveis e possíveis modulações.'] ]}
];
const NOTES=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
let state=JSON.parse(localStorage.getItem('pm_state')||'{}');state.done=state.done||{};state.correct=state.correct||0;state.attempts=state.attempts||0;state.streak=state.streak||0;
function save(){localStorage.setItem('pm_state',JSON.stringify(state))}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function progress(){return Math.round(Object.keys(state.done).length/320*100)}
function shell(active,body){document.getElementById('app').innerHTML=`<div class="app"><header class="top"><div class="brand"><div class="logo">🎵</div><div><h1>Percepção Musical</h1><p>Treinamento auditivo • violão • harmonia</p></div></div><nav class="nav">${[['home','🏠 Início'],['courses','📚 Cursos'],['train','🎧 Treinar'],['guitar','🎸 Violão'],['discover','🔎 Descobrir tom'],['progress','📊 Progresso']].map(x=>`<button class="${active==x[0]?'active':''}" onclick="route('${x[0]}')">${x[1]}</button>`).join('')}</nav></header><main class="wrap">${body}</main><div class="footer">Curso de Percepção Musical • progresso salvo neste aparelho</div></div>`}
function route(r){if(r==='home')home();if(r==='courses')courses();if(r==='train')train();if(r==='guitar')guitar();if(r==='discover')discover();if(r==='progress')stats()}
function home(){shell('home',`<section class="hero"><h2>Seu ouvido é treinável. 🎧</h2><p>Estude percepção musical de forma progressiva: encontre a “casa”, reconheça graus e intervalos, entenda acordes e finalmente descubra o tom de músicas e cantores pelo ouvido.</p><div class="row" style="margin-top:15px"><button class="btn" onclick="route('train')">▶ Treino de hoje</button><button class="btn alt" onclick="route('courses')">Ver curso</button></div></section><div class="grid"><div class="card"><div class="muted">Progresso</div><div class="stat">${progress()}%</div><div class="progress"><div class="bar" style="width:${progress()}%"></div></div></div><div class="card"><div class="muted">Acertos</div><div class="stat">${state.attempts?Math.round(state.correct/state.attempts*100):0}%</div><p>${state.correct} respostas corretas em ${state.attempts} tentativas.</p></div><div class="card"><div class="muted">Exercícios</div><div class="stat">${Object.keys(state.done).length}/320</div><p>Seu banco principal de treinamento.</p></div></div><div class="section"><h2>Trilha recomendada</h2></div><div class="grid">${V.map(v=>`<div class="card vol ${v.color}"><h3>📘 Volume ${v.id} — ${v.title}</h3><p>${v.desc}</p><button class="btn alt" onclick="openVol(${v.id})">Estudar ${v.range}</button></div>`).join('')}</div>`)}
function courses(){shell('courses',`<div class="section"><h2>📚 Curso completo</h2><p class="muted">A sequência foi desenhada para sair do básico e chegar à aplicação prática.</p></div><div class="grid">${V.map(v=>`<div class="card vol ${v.color}"><h3>Volume ${v.id} — ${v.title}</h3><p><b>Exercícios:</b> ${v.range}</p><p>${v.desc}</p><button class="btn" onclick="openVol(${v.id})">Abrir volume</button></div>`).join('')}</div>`)}
function openVol(id){let v=V[id-1];shell('courses',`<button class="btn alt" onclick="route('courses')">← Volumes</button><div class="hero" style="margin-top:13px"><h2>Volume ${v.id} — ${v.title}</h2><p>${v.desc}</p></div><div class="lesson">${v.lessons.map((l,i)=>`<div class="card"><h3>${i+1}. ${l[0]}</h3><p>${l[1]}</p>${i===0?`<div class="callout"><b>Regra de ouro:</b> primeiro ouça e cante; só depois procure a resposta no violão.</div>`:''}</div>`).join('')}</div><div class="card" style="margin-top:14px"><h3>🎧 Prática do volume</h3><p>Faça 10 exercícios do banco correspondente e registre cada erro. O objetivo é precisão, não velocidade.</p><button class="btn" onclick="startRange(${id})">Começar exercícios</button></div>`)}
let ex={id:1,type:'tonic',answer:'C',prompt:'Qual nota parece ser a “casa” depois de ouvir a sequência?',choices:NOTES};
function newEx(id){let types=id<=1?'tonic':id===2?'degree':id===3?'interval':id===4?'chord':'key';let n=Math.floor(Math.random()*12),a=NOTES[n];if(types==='tonic')return {type:'tonic',answer:a,prompt:'Qual nota funciona como centro/“casa”?',choices:NOTES};if(types==='degree'){let ds=['I','II','III','IV','V','VI','VII'];let d=ds[Math.floor(Math.random()*7)];return {type:'degree',answer:d,prompt:'Qual grau foi destacado em relação à tônica?',choices:ds}}if(types==='interval'){let ints=['2ª menor','2ª maior','3ª menor','3ª maior','4ª justa','5ª justa','6ª maior','8ª justa'];let q=ints[Math.floor(Math.random()*ints.length)];return {type:'interval',answer:q,prompt:'Qual é o intervalo ouvido?',choices:ints}}if(types==='chord'){let cs=['Maior','Menor','Diminuto','Aumentado'];return {type:'chord',answer:cs[Math.floor(Math.random()*4)],prompt:'Qual é a qualidade do acorde?',choices:cs}}let keys=NOTES.map(x=>x+' maior');return {type:'key',answer:a+' maior',prompt:'Qual tonalidade está sendo sugerida?',choices:keys}}
function toneFreq(note){let i=NOTES.indexOf(note);return 261.63*Math.pow(2,i/12)}
function beep(note,dur=.65,delay=0){let C=new (window.AudioContext||window.webkitAudioContext)();let o=C.createOscillator(),g=C.createGain();o.type='sine';o.frequency.value=toneFreq(note);g.gain.setValueAtTime(.0001,C.currentTime+delay);g.gain.exponentialRampToValueAtTime(.18,C.currentTime+delay+.02);g.gain.exponentialRampToValueAtTime(.0001,C.currentTime+delay+dur);o.connect(g).connect(C.destination);o.start(C.currentTime+delay);o.stop(C.currentTime+delay+dur+.04)}
function playExercise(e){if(e.type==='tonic'){let a=e.answer;beep(a,.7);beep(NOTES[(NOTES.indexOf(a)+7)%12],.45,.75);beep(a,.9,1.25)}else if(e.type==='degree'){beep('C',.7);beep('G',.4,.75);beep('E',.5,1.2)}else if(e.type==='interval'){beep('C',.5);let idx={'2ª menor':1,'2ª maior':2,'3ª menor':3,'3ª maior':4,'4ª justa':5,'5ª justa':7,'6ª maior':9,'8ª justa':12}[e.answer];beep(NOTES[idx%12],.7,.65)}else{beep('C',.55);beep('E',.55,.6);beep('G',.65,1.2)}}
function train(){let e=newEx(Math.ceil(Math.random()*5));ex=e;shell('train',`<div class="section"><h2>🎧 Treino de hoje</h2><p class="muted">Ouça primeiro. Responda pelo ouvido. Use o violão apenas para conferir.</p></div><div class="exercise"><div class="row"><span class="muted">Tipo: <b>${e.type}</b></span><span class="muted">• tentativa nova</span></div><h3 style="font-size:22px">${e.prompt}</h3><button class="btn" onclick="playExercise(ex)">🔊 Reproduzir</button><div class="choices">${e.choices.map(c=>`<button class="choice" onclick="answer(${JSON.stringify(c)})">${c}</button>`).join('')}</div><div id="res"></div></div><div class="card" style="margin-top:13px"><h3>Como estudar</h3><p>1. Ouça sem olhar. 2. Cante a tônica ou a nota de referência. 3. Responda. 4. Só então confira no instrumento. 5. Registre o erro.</p></div>`)}
function answer(c){state.attempts++;let ok=c===ex.answer;if(ok)state.correct++;state.done[Date.now()]=1;save();document.getElementById('res').innerHTML=`<div class="result ${ok?'ok':'bad'}"><b>${ok?'✅ Correto!':'❌ Ainda não.'}</b><br>Resposta: <b>${ex.answer}</b><br><span>${ok?'Continue aumentando a dificuldade.':'Repita o áudio e procure a sensação de centro antes de usar o instrumento.'}</span></div><div class="row" style="margin-top:10px"><button class="btn" onclick="train()">Próximo exercício</button><button class="btn alt" onclick="playExercise(ex)">Ouvir novamente</button></div>`}
function startRange(id){train()}
function guitar(){let strings=[['E','E'],['B','B'],['G','G'],['D','D'],['A','A'],['E','E']];shell('guitar',`<div class="section"><h2>🎸 Laboratório do Violão</h2><p class="muted">Afinação padrão: E–A–D–G–B–E. Toque mentalmente uma nota e procure suas posições.</p></div><div class="card"><h3>Escolha uma nota</h3><div class="choices">${NOTES.map(n=>`<button class="choice" onclick="showNote('${n}')">${n}</button>`).join('')}</div><div id="neck"></div></div><div class="callout"><b>Exercício:</b> escolha uma nota, cante-a, encontre no braço sem olhar e depois confira. Tente em regiões diferentes.</div>`)}
function showNote(n){let sem={'E':4,'A':9,'D':2,'G':7,'B':11};let out='<h3>Posições de '+n+'</h3><div class="fret"><span class="nut">corda</span>'+Array.from({length:12},(_,i)=>`<span>${i+1}</span>`).join('');for(let s of ['E','A','D','G','B','E']){out+=`<span class="nut">${s}</span>`;for(let f=1;f<=12;f++){let x=NOTES[(sem[s]+f)%12];out+=`<span class="${x===n?'note':''}">${x}</span>`}}out+='</div>';document.getElementById('neck').innerHTML=out;beep(n,.7)}
function discover(){shell('discover',`<section class="hero"><h2>🔎 Descobrir o tom</h2><p>Treine exatamente a habilidade principal: encontrar a “casa”, identificar maior/menor e confirmar a tonalidade.</p></section><div class="card"><h3>Protocolo de 30 segundos</h3><ol><li>Ouça o trecho inteiro.</li><li>Pare de pensar em nomes e procure a sensação de repouso.</li><li>Cante a nota-casa.</li><li>Encontre-a no violão.</li><li>Teste se a terça é maior ou menor.</li><li>Confirme com o acorde de repouso e a nota final.</li></ol><div class="callout warning"><b>Armadilha:</b> a primeira nota do cantor pode ser III, V, VI ou outro grau. Não a aceite automaticamente como tônica.</div><button class="btn" onclick="route('train')">🎧 Fazer exercício de tônica</button></div><div class="grid"><div class="card"><h3>Estratégia da nota final</h3><p>Ouça a última nota e imagine se a música poderia terminar ali. Se houver sensação forte de conclusão, é uma pista importante.</p></div><div class="card"><h3>Estratégia do baixo</h3><p>Procure notas de chegada no baixo. Em progressões simples, elas frequentemente revelam as raízes.</p></div><div class="card"><h3>Confirmação harmônica</h3><p>Depois da tônica, teste I, IV e V. Se a relação fizer sentido, você tem uma confirmação muito mais forte.</p></div></div>`)}
function stats(){let pct=state.attempts?Math.round(state.correct/state.attempts*100):0;shell('progress',`<div class="section"><h2>📊 Seu progresso</h2></div><div class="grid"><div class="card"><div class="muted">Exercícios concluídos</div><div class="stat">${Object.keys(state.done).length}</div></div><div class="card"><div class="muted">Precisão</div><div class="stat">${pct}%</div></div><div class="card"><div class="muted">Tentativas</div><div class="stat">${state.attempts}</div></div></div><div class="card" style="margin-top:13px"><h3>Próximo foco</h3><p>${pct<60?'Volte aos fundamentos: tônica, repouso e maior/menor.':pct<80?'Treine graus e intervalos antes de avançar para harmonia.':'Você já pode aumentar a dificuldade e focar em acordes e identificação de tom.'}</p><div class="progress"><div class="bar" style="width:${Math.min(pct,100)}%"></div></div></div><div class="card" style="margin-top:13px"><h3>🔄 Reiniciar progresso</h3><p>Use somente se quiser começar o curso novamente neste aparelho.</p><button class="btn red" onclick="if(confirm('Apagar todo o progresso?')){localStorage.removeItem('pm_state');location.reload()}">Apagar progresso</button></div>`)}
home();
</script></body></html>
