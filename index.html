<style>
:root{--bg:#070b16;--card:#10192b;--card2:#0c1424;--line:#263653;--text:#f4f7ff;--muted:#9ba9c4;--cyan:#43e7ff;--violet:#9b7bff;--green:#50e3a4;--gold:#ffd166;--red:#ff6685}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#18265a,#070b16 42%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.top{position:sticky;top:0;z-index:10;background:#070b16ee;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.head{max-width:1000px;margin:auto;padding:12px 15px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#07101c;font-size:22px;font-weight:900}.brand b{display:block}.brand small{color:var(--muted)}.xp{color:var(--gold);font-weight:800;font-size:13px}.wrap{max-width:1000px;margin:auto;padding:18px 14px 90px}.hero,.card,.exercise{background:linear-gradient(160deg,#111c32,#0b1220);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:13px}.hero{padding:24px}.eyebrow{color:var(--cyan);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:900}.hero h1{font-size:31px;line-height:1.05;margin:8px 0}.hero p,.card p{color:var(--muted);line-height:1.6}.section{margin:23px 0 10px}.section h2{margin:0 0 7px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:13px;padding:12px 15px;background:linear-gradient(135deg,var(--cyan),#75b9ff);color:#06101a;font-weight:900}.btn.alt{background:#17233a;color:var(--text);border:1px solid #30415f}.btn:disabled{opacity:.4}.pill,.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:11px}.bar{height:9px;background:#19243a;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));border-radius:99px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0b1322;border:1px solid var(--line);border-radius:15px;padding:12px}.stat b{display:block;font-size:22px}.stat small{color:var(--muted)}.module{position:relative}.module h3{margin:10px 0 5px}.listen{width:100%;min-height:64px;border:1px solid #31536c;border-radius:17px;background:linear-gradient(135deg,#0b2633,#101d32);color:#e2fbff;font-weight:900;font-size:16px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin:15px 0}.choice{border:1px solid #2b3b57;border-radius:14px;background:#111b2d;color:var(--text);padding:14px 8px;font-weight:800}.choice.good{border-color:var(--green);background:#103126}.choice.bad{border-color:var(--red);background:#351622}.feedback{margin-top:12px;padding:14px;border-radius:14px;line-height:1.55}.ok{background:#0d2b22;border:1px solid #245f4b}.no{background:#32151f;border:1px solid #633043}.path{display:flex;gap:8px;overflow:auto;padding:4px 0 10px}.node{min-width:130px;text-align:left;background:#0d1525;border:1px solid var(--line);border-radius:17px;color:var(--text);padding:13px}.node.lock{opacity:.45}.node strong{font-size:22px}.node small{display:block;color:var(--muted);margin:4px 0}.lesson{line-height:1.75}.lesson h3{color:var(--cyan);margin-top:23px}.callout{padding:13px 14px;border-left:4px solid var(--cyan);background:#0c2030;border-radius:12px;margin:13px 0}.callout.gold{border-left-color:var(--gold);background:#211b0b}.guitar{overflow:auto;background:#1b120d;border:1px solid #493426;border-radius:17px;padding:10px}.neck{min-width:760px;height:235px;position:relative;border-radius:12px;background:linear-gradient(90deg,#704323,#b7783d,#744423)}.fret{position:absolute;top:0;bottom:0;border-right:2px solid #f0d5aa77}.string{position:absolute;left:0;right:0;height:2px;background:#d9e2e8}.dot{position:absolute;width:25px;height:25px;border-radius:50%;background:#f4f7ff;color:#152035;display:grid;place-items:center;font-size:9px;font-weight:900;transform:translate(-50%,-50%);z-index:2}.dot.root{background:var(--cyan)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#080d18ee;border-top:1px solid var(--line);z-index:20}.nav{max-width:700px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{background:none;border:0;color:#71809a;padding:9px 3px;font-size:10px}.nav b{display:block;font-size:18px}.nav .on{color:var(--cyan)}.footer{text-align:center;color:#66758e;font-size:11px;padding:20px}.hide{display:none!important}@media(max-width:600px){.hero h1{font-size:26px}.wrap{padding-left:11px;padding-right:11px}.stats{grid-template-columns:repeat(3,1fr)}}
</style>

<body>
<header class="top"><div class="head"><div class="brand"><div class="logo">♪</div><div><b>Percep-O-Musical</b><small>Curso de percepção auditiva</small></div></div><div class="xp" id="xp">⚡ 0 XP</div></div></header>
<main class="wrap"><div id="app"><section class="hero"><span class="eyebrow">Treinamento auditivo</span><h1>Aprenda a ouvir música de verdade.</h1><p>Você vai aprender a reconhecer relações sonoras, encontrar a tônica, ouvir intervalos, entender acordes e descobrir o tom de músicas pelo ouvido.</p><button class="btn" id="boot">▶ Começar</button></section></div></main>
<nav class="bottom"><div class="nav"><button data-page="home"><b>⌂</b>Início</button><button data-page="course"><b>◈</b>Curso</button><button data-page="coach"><b>◎</b>Coach</button><button data-page="lab"><b>♬</b>Violão</button></div></nav>
<script>
'use strict';
const NOTES=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const NAME={C:'Dó','C#':'Dó♯',D:'Ré',Eb:'Mi♭',E:'Mi',F:'Fá','F#':'Fá♯',G:'Sol',Ab:'Lá♭',A:'Lá',Bb:'Si♭',B:'Si'};
const FREQ={C:261.626,'C#':277.183,D:293.665,Eb:311.127,E:329.628,F:349.228,'F#':369.994,G:391.995,Ab:415.305,A:440,Bb:466.164,B:493.883};
const NAT=['C','D','E','F','G','A','B'];
const MODULES=[
{id:1,icon:'◉',name:'O ouvido acorda',range:[1,50],goal:'Altura, comparação, memória e primeiras notas.',lessons:['Escutar antes de nomear','Criar uma âncora','Dar nome ao som','Construir o mapa natural','Tirar as rodinhas']},
{id:2,icon:'⌂',name:'Encontrar a casa',range:[51,120],goal:'Tônica, maior/menor, graus, baixo e funções.',lessons:['A sensação de casa','Graus da escala','Maior ou menor','Baixo como mapa','I–IV–V e ii–V–I']},
{id:3,icon:'↕',name:'Medir distâncias',range:[121,180],goal:'Direção, intervalos, contorno e memória melódica.',lessons:['Sobe ou desce?','Tamanho relativo','Contorno','Ditado em camadas','Audição interna']},
{id:4,icon:'♬',name:'Ler a harmonia',range:[181,260],goal:'Tríades, inversões, sétimas, baixo e progressões.',lessons:['Maior × menor','O baixo separado','Inversões','Sétimas','Progressões']},
{id:5,icon:'⌁',name:'Descobrir músicas',range:[261,300],goal:'Tom de cantor, violão, capo, transposição e modulação.',lessons:['Protocolo do tom','O cantor começa fora','Violão como confirmação','Capo e transposição','Modulação']},
{id:6,icon:'★',name:'Desafio do músico',range:[301,320],goal:'Testes mistos e aplicação real.',lessons:['Sem pistas','Mistura real','Pressão','Diagnóstico','Prova final']}
];
let state=loadState(), current=null, page='home';
function loadState(){try{return JSON.parse(localStorage.getItem('pom_v2'))||{done:{},attempts:0,correct:0,xp:0,streak:0,skills:{}}}catch(e){return {done:{},attempts:0,correct:0,xp:0,streak:0,skills:{}}}}
function save(){localStorage.setItem('pom_v2',JSON.stringify(state));document.getElementById('xp').textContent='⚡ '+state.xp+' XP'}
function esc(x){return String(x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pct(){return state.attempts?Math.round(state.correct/state.attempts*100):0}
function range(m){return m.range[1]-m.range[0]+1}
function modDone(m){let n=0;for(let i=m.range[0];i<=m.range[1];i++)if(state.done[i])n++;return n}
function unlocked(id){if(id===1)return true;let prev=MODULES[id-2];return modDone(prev)>=Math.ceil(range(prev)*.8)}
function shell(html){document.getElementById('app').innerHTML=html;document.querySelectorAll('[data-page]').forEach(function(b){b.classList.toggle('on',b.dataset.page===page)})}
function home(){page='home';let e=nextExercise();shell('<section class="hero"><span class="eyebrow">Aprender → ouvir → praticar → diagnosticar</span><h1>Seu ouvido pode ser treinado.</h1><p>O Percep-O-Musical não joga perguntas aleatórias. Cada experiência tem uma habilidade por trás e seus erros alimentam o próximo treino.</p><div class="row"><button class="btn" data-start="'+e.id+'">▶ Continuar treino</button><button class="btn alt" data-page="course">Ver jornada</button></div></section><div class="section"><h2>Seu painel</h2><div class="stats"><div class="stat"><b>'+Object.keys(state.done).length+'</b><small>experiências</small></div><div class="stat"><b>'+pct()+'%</b><small>precisão</small></div><div class="stat"><b>'+state.streak+'🔥</b><small>sequência</small></div></div></div><div class="section"><h2>Missão de hoje</h2><div class="card"><span class="pill">'+e.skill+'</span><h3>'+e.prompt+'</h3><p>'+e.why+'</p><button class="btn" data-start="'+e.id+'">Começar experiência '+String(e.id).padStart(3,'0')+'</button></div></div><div class="section"><h2>Mapa da jornada</h2>'+pathMini()+'</div>')}
function pathMini(){return '<div class="path">'+MODULES.map(function(m){let u=unlocked(m.id);return '<button class="node '+(u?'':'lock')+'" data-module="'+m.id+'"><strong>'+m.icon+'</strong><small>Volume '+m.id+' · '+m.name+'</small><span class="tag">'+modDone(m)+'/'+range(m)+'</span></button>'}).join('')+'</div>'}
function course(){page='course';shell('<div class="section"><span class="eyebrow">A jornada completa</span><h2>Seis territórios de ouvido</h2><p style="color:var(--muted)">Você avança por domínio, não por quantidade.</p></div>'+MODULES.map(moduleCard).join(''))}
function moduleCard(m){let d=modDone(m),u=unlocked(m.id),p=Math.round(d/range(m)*100);return '<article class="card module"><div class="row"><span class="pill">'+m.icon+' VOLUME '+m.id+'</span><span class="tag">'+String(m.range[0]).padStart(3,'0')+'–'+m.range[1]+'</span></div><h3>'+m.name+'</h3><p>'+m.goal+'</p><div class="bar"><i style="width:'+p+'%"></i></div><p>'+d+'/'+range(m)+' experiências concluídas</p><div class="row"><button class="btn" '+(u?'':'disabled')+' data-module="'+m.id+'">'+(u?'Entrar':'Bloqueado')+'</button><button class="btn alt" data-lesson="'+m.id+'">Estudar teoria</button></div></article>'}
function moduleView(id){let m=MODULES[id-1],e=nextInModule(m),d=modDone(m);shell('<div class="card"><button class="btn alt" data-page="course">← Jornada</button><span class="pill" style="margin-left:7px">VOLUME '+id+'</span><h2>'+m.icon+' '+m.name+'</h2><p>'+m.goal+'</p><div class="bar"><i style="width:'+Math.round(d/range(m)*100)+'%"></i></div><p>'+d+'/'+range(m)+' experiências</p><button class="btn" data-start="'+e.id+'">▶ Continuar</button></div><div class="section"><h2>O que você vai aprender</h2><div class="grid">'+m.lessons.map(function(x,i){return '<button class="card" style="text-align:left;color:inherit" data-lesson="'+id+'" data-lesson-index="'+i+'"><span class="tag">AULA '+(i+1)+'</span><h3>'+x+'</h3><p>Conceito → escuta guiada → prática → aplicação.</p></button>'}).join('')+'</div></div>')}
function lesson(id,i){let m=MODULES[id-1],titles=['Escutar antes de nomear','Criar uma âncora','Dar nome ao som','Transferir para a música','Consolidar'];let title=m.lessons[i%5]||titles[i%5];shell('<div class="card lesson"><button class="btn alt" data-module="'+id+'">← Volume</button><span class="pill" style="margin-left:7px">AULA '+(i+1)+'</span><h2>'+title+'</h2><p><b>Ideia central:</b> primeiro perceba a relação sonora; depois dê nome ao que percebeu. Teoria sem escuta vira decoração.</p><div class="callout">Feche os olhos quando ouvir. Tente cantar mentalmente a resposta antes de tocar em qualquer opção.</div><button class="listen" data-demo="'+id+'">🔊 Fazer experimento guiado</button><h3>Como estudar</h3><ol><li>Ouça duas ou três vezes.</li><li>Descreva mentalmente o que mudou.</li><li>Nomeie a relação.</li><li>Aplique a mesma ideia em uma música.</li></ol><div class="row"><button class="btn alt" data-lesson-prev="'+id+'">← Anterior</button><button class="btn" data-lesson-next="'+id+'">Próxima →</button></div></div>')}
function nextInModule(m){for(let i=m.range[0];i<=m.range[1];i++)if(!state.done[i])return exercise(i);return exercise(m.range[0])}
function nextExercise(){for(let i=1;i<=320;i++)if(!state.done[i])return exercise(i);return exercise(1)}
function exercise(id){if(id<=50)return basic(id);if(id<=120)return tonal(id);if(id<=180)return interval(id);if(id<=260)return harmony(id);if(id<=300)return song(id);return finalEx(id)}
function mk(id,skill,prompt,answer,choices,play,why){return {id:id,skill:skill,prompt:prompt,answer:answer,choices:choices,play:play,why:why}}
function basic(id){let a=NAT[(id-1)%7],b=NAT[(id+2)%7];if(id<=15)return mk(id,'altura relativa','Qual som ficou mais agudo no final?',NAME[b],[NAME[a],NAME[b]],function(){playSeq([a,b]);},'Você está treinando comparação, a base do ouvido relativo.');if(id<=30)return mk(id,'reconhecimento','Qual foi a nota-alvo?',NAME[a],NAT.map(function(n){return NAME[n]}),function(){playSeq([a,b,a]);},'O nome entra depois da percepção.');if(id<=40)return mk(id,'memória','Qual nota reapareceu?',NAME[a],[NAME[a],NAME[b],NAME[NAT[(id+4)%7]]],function(){playSeq([a,b,a]);},'A mesma nota precisa sobreviver à interrupção.');return mk(id,'memória tonal','Qual centro você percebe?',NAME[a],[NAME[a],NAME[b],NAME[NAT[(id+5)%7]]],function(){playSeq([a,b,NAT[(NAT.indexOf(a)+4)%7],a]);},'Começamos a transformar uma nota em sensação de centro.')}
function tonal(id){let k=id-51,root=NAT[k%7],minor=k%2===1,third=NOTES[(NOTES.indexOf(root)+(minor?3:4))%12];if(id<=75)return mk(id,'tônica','Qual nota parece ser a casa?',NAME[root],NAT.map(function(n){return NAME[n]}),function(){playSeq([root,NOTES[(NOTES.indexOf(root)+7)%12],third,root]);},'A tônica é a sensação de repouso.');if(id<=100)return mk(id,'graus','Qual grau foi destacado?',['I','II','III','IV','V','VI','VII'][k%7],['I','II','III','IV','V','VI','VII'],function(){playSeq([root,third]);},'O ouvido aprende funções em relação à tônica.');return mk(id,'maior menor','O centro soa maior ou menor?',minor?'menor':'maior',['maior','menor'],function(){playSeq([root,third,NOTES[(NOTES.indexOf(root)+7)%12],root]);},'A terça é uma pista importante para a cor maior/menor.')}
function interval(id){let k=id-121,a=NAT[k%7],steps=(k%6)+1,b=NAT[(NAT.indexOf(a)+steps)%7],labels=['2ª','3ª','4ª','5ª','6ª','7ª'];return mk(id,'intervalos','Qual é o tamanho da distância?',labels[steps-1],labels,function(){playSeq([a,b]);},'Primeiro ouça a direção; depois compare o tamanho.')}
function harmony(id){let k=id-181,root=NAT[k%7],minor=k%3===1;if(id<=210)return mk(id,'tríades','A tríade soa maior ou menor?',minor?'menor':'maior',['maior','menor'],function(){playChord(root,minor?'menor':'maior');},'A terça muda a qualidade do acorde.');if(id<=230){let third=NOTES[(NOTES.indexOf(root)+(minor?3:4))%12],fifth=NOTES[(NOTES.indexOf(root)+7)%12],bass=k%2?fifth:root;return mk(id,'baixo','Qual nota está no baixo?',NAME[bass],[NAME[root],NAME[third],NAME[fifth]],function(){playChord(root,minor?'menor':'maior',bass);},'Ouça o baixo separadamente do bloco harmônico.');}if(id<=245)return mk(id,'sétimas','O acorde tem sensação de dominante?', 'sim',['sim','não'],function(){play7(root);},'A sétima menor cria uma assinatura forte de tensão.');return mk(id,'progressões','Qual função fecha a progressão?','I',['I','IV','V','vi'],function(){playProgression(root);},'Aprenda a reconhecer movimento, não apenas acordes isolados.')}
function song(id){let k=id-261,root=NOTES[(k*2)%12],first=NOTES[(NOTES.indexOf(root)+[0,4,7,9][k%4])%12];if(id<=275)return mk(id,'tom de cantor','O cantor começa fora da tônica. Qual é a casa?',NAME[root],NOTES.map(function(n){return NAME[n]}),function(){playSinger(root,first);},'A primeira nota da melodia não precisa ser a tônica.');if(id<=288)return mk(id,'tonalidade','O centro é maior ou menor?',k%2?'menor':'maior',['maior','menor'],function(){playSinger(root,first,k%2?'menor':'maior');},'Encontre a casa e compare sua terça.');if(id<=295)return mk(id,'transposição','Forma de C com capo na casa 2 soa em qual tom?','Ré',['Dó','Ré','Mi','Sol'],function(){playSeq(['C','E','G']);setTimeout(function(){playSeq(['D','F#','A'])},900);},'O desenho no violão e o som real podem ser diferentes.');return mk(id,'modulação','A nova casa está a quantos semitons da primeira?','5',['2','3','5','7'],function(){playModulation(root);},'A nova tônica precisa persistir como centro.')}
function finalEx(id){let e=exercise(1+((id-301)*17)%300);return mk(id,'integração','DESAFIO FINAL: '+e.prompt,e.answer,e.choices,e.play,'Transferência: misture habilidades em vez de depender de uma única pista.')}
function train(id){current=exercise(id);page='train';let e=current;shell('<div class="card"><button class="btn alt" data-page="home">← Sair</button><span class="pill" style="margin-left:7px">EXPERIÊNCIA '+String(id).padStart(3,'0')+' / 320</span><h2>'+e.prompt+'</h2><p><span class="tag">'+e.skill+'</span></p><button class="listen" id="listen">◉ Ouvir áudio</button><div class="choices">'+e.choices.map(function(c,i){return '<button class="choice" data-answer="'+i+'">'+esc(c)+'</button>'}).join('')+'</div><div id="feedback"></div></div><div class="card"><b>Por que este exercício existe?</b><p>'+e.why+'</p></div>')}
function answer(i){if(!current)return;let e=current,choice=e.choices[i],ok=String(choice)===String(e.answer);state.attempts++;if(ok){state.correct++;state.xp+=10;state.streak++;state.done[e.id]=1}else state.streak=0;state.skills[e.skill]=state.skills[e.skill]||{a:0,c:0};state.skills[e.skill].a++;if(ok)state.skills[e.skill].c++;save();document.querySelectorAll('.choice').forEach(function(b,j){b.disabled=true;if(j===i)b.classList.add(ok?'good':'bad');if(!ok&&String(e.choices[j])===String(e.answer))b.classList.add('good')});document.getElementById('feedback').innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><b>'+(ok?'✓ Acertou!':'↺ Use o erro como mapa.')+'</b><br>Resposta: <b>'+esc(e.answer)+'</b><p>'+e.why+'</p><button class="btn" data-start="'+nextExercise().id+'">Próxima missão</button> <button class="btn alt" id="again">Ouvir novamente</button></div>'}
function coach(){page='coach';let list=Object.keys(state.skills).sort(function(a,b){let A=state.skills[a],B=state.skills[b];return A.c/Math.max(1,A.a)-B.c/Math.max(1,B.a)}),weak=list[0]||'altura relativa';let e=nextSkill(weak);shell('<section class="hero"><span class="eyebrow">Coach auditivo</span><h1>Seu treino se adapta aos seus erros.</h1><p>Quando você erra, a próxima missão procura reforçar a relação que ficou frágil.</p></section><div class="card"><span class="pill">Foco atual</span><h2>'+weak+'</h2><p>'+(state.skills[weak]?'Precisão: '+Math.round(state.skills[weak].c/state.skills[weak].a*100)+'%':'Ainda sem dados suficientes.')+'</p><button class="btn" data-start="'+e.id+'">Treinar este fundamento</button></div>')}
function nextSkill(skill){for(let i=1;i<=320;i++){let e=exercise(i);if(!state.done[i]&&e.skill===skill)return e}return nextExercise()}
function lab(){page='lab';shell('<div class="section"><span class="eyebrow">Laboratório</span><h2>Violão como ferramenta do ouvido</h2><p style="color:var(--muted)">Use o instrumento para confirmar hipóteses. A ideia é ouvir primeiro.</p></div><div class="card"><h3>🎸 Braço do violão</h3>'+guitar()+'</div><div class="card"><h3>Descobrir o tom de um cantor</h3><p>Casa → cantar a casa → encontrar no violão → maior/menor → confirmar.</p><button class="btn" data-demo="singer">🔊 Ouvir exemplo</button></div>')}
function guitar(){let strings=['E','A','D','G','B','E'],html='<div class="guitar"><div class="neck">';for(let f=1;f<=12;f++)html+='<span class="fret" style="left:'+f/13*100+'%"></span>';for(let s=0;s<6;s++){let top=18+s*39;html+='<span class="string" style="top:'+top+'px"></span><span class="tag" style="position:absolute;left:4px;top:'+(top-8)+'px">'+strings[s]+'</span>'}html+='</div></div>';return html}
function audioCtx(){if(!audioCtx.ctx)audioCtx.ctx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.ctx.state==='suspended')audioCtx.ctx.resume();return audioCtx.ctx}
function tone(n,t,d=.55,type='triangle',vol=.2){let c=audioCtx(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=FREQ[n]||440;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.03)}
function playSeq(seq,d=.55,type='triangle'){let c=audioCtx(),t=c.currentTime+.05;seq.forEach(function(n,i){tone(n,t+i*d,d,type,.18)})}
function playChord(root,q,bass){let r=NOTES.indexOf(root),third=q==='menor'?3:4,fifth=7,arr=[root,NOTES[(r+third)%12],NOTES[(r+fifth)%12]];if(bass)arr.unshift(bass);let c=audioCtx(),t=c.currentTime+.05;arr.forEach(function(n,i){tone(n,t+i*.04,.9,'triangle',.13)})}
function play7(root){let r=NOTES.indexOf(root),arr=[root,NOTES[(r+4)%12],NOTES[(r+7)%12],NOTES[(r+10)%12]],c=audioCtx(),t=c.currentTime+.05;arr.forEach(function(n,i){tone(n,t+i*.04,.9,'sawtooth',.11)})}
function playProgression(root){let r=NOTES.indexOf(root),arr=[0,7,9,5],c=audioCtx();arr.forEach(function(x,i){setTimeout(function(){playChord(NOTES[(r+x)%12],'maior')},i*500)})}
function playSinger(root,first,mode='maior'){let r=NOTES.indexOf(root),third=NOTES[(r+(mode==='menor'?3:4))%12];playSeq([first,third,root,NOTES[(r+7)%12],root],.48,'sawtooth')}
function playModulation(root){let r=NOTES.indexOf(root),n=NOTES[(r+5)%12];playSeq([root,NOTES[(r+7)%12],root]);setTimeout(function(){playSeq([n,NOTES[(r+5+7)%12],n])},1800)}
function demo(id){if(id==='singer')playSinger('C','E');else playSeq(['C','G','E','C'])}

document.addEventListener('click',function(ev){let b=ev.target.closest('[data-page]');if(b){let p=b.dataset.page;if(p==='home')home();else if(p==='course')course();else if(p==='coach')coach();else if(p==='lab')lab();return}b=ev.target.closest('[data-start]');if(b){train(Number(b.dataset.start));return}b=ev.target.closest('[data-module]');if(b){let id=Number(b.dataset.module);if(unlocked(id))moduleView(id);return}b=ev.target.closest('[data-lesson]');if(b){lesson(Number(b.dataset.lesson),Number(b.dataset.lessonIndex||0));return}b=ev.target.closest('[data-lesson-next]');if(b){lesson(Number(b.dataset.lessonNext),1);return}b=ev.target.closest('[data-lesson-prev]');if(b){lesson(Number(b.dataset.lessonPrev),0);return}b=ev.target.closest('[data-answer]');if(b){answer(Number(b.dataset.answer));return}if(ev.target.closest('#listen')&&current){current.play();return}if(ev.target.closest('#again')&&current){current.play();return}b=ev.target.closest('[data-demo]');if(b){demo(b.dataset.demo);return}});

document.getElementById('boot').addEventListener('click',home);
save();
</script>
