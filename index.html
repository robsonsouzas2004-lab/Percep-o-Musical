<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120818"><title>Percep-O-Musical</title><style>:root{--bg:#09060d;--card:#17101f;--line:#392546;--text:#faf6ff;--muted:#b5a5bd;--pink:#ff4fd8;--purple:#9d6cff;--green:#53e0a5;--gold:#ffd166;--red:#ff6685}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#321044,#09060d 45%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.top{position:sticky;top:0;z-index:10;background:#09060dee;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.head{max-width:1000px;margin:auto;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--purple));color:#180b1e;font-size:22px;font-weight:900}.brand b{display:block}.brand small,.card p,.hero p,.mini{color:var(--muted)}.xp{color:var(--gold);font-weight:800}.wrap{max-width:1000px;margin:auto;padding:18px 14px 95px}.hero,.card{background:linear-gradient(160deg,#1b1125,#100a16);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:13px}.hero h1{font-size:31px;line-height:1.05;margin:8px 0}.eyebrow{color:var(--pink);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:13px;padding:12px 15px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#16091b;font-weight:900;cursor:pointer}.btn.alt{background:#21152c;color:var(--text);border:1px solid #503666}.callout{padding:14px;border-left:4px solid var(--pink);background:#24112a;border-radius:12px;margin:13px 0;line-height:1.6}.callout.gold{border-left-color:var(--gold);background:#241c0d}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:15px 0}.choice{border:1px solid #493454;border-radius:14px;background:#18101f;color:var(--text);padding:14px 8px;font-weight:800;cursor:pointer}.choice.good{border-color:var(--green)}.choice.bad{border-color:var(--red)}.feedback{padding:14px;border-radius:14px;margin-top:10px;line-height:1.5}.ok{background:#0d2b22;border:1px solid #245f4b}.no{background:#32151f;border:1px solid #633043}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#110b18;border:1px solid var(--line);border-radius:15px;padding:12px}.stat b{display:block;font-size:22px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#2b1735;color:#e7c9ed;font-size:11px}.memory{min-height:180px;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#39145a,#100a16 68%);border:1px solid #633d7b;border-radius:22px;padding:25px}.memory strong{font-size:44px}.listen{width:100%;min-height:58px;border:1px solid #673b73;border-radius:17px;background:#24132b;color:#ffe9fb;font-weight:900;font-size:16px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b0710ee;border-top:1px solid var(--line);z-index:20}.nav{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr)}.nav button{background:none;border:0;color:#8e7e98;padding:9px 3px;font-size:10px}.nav b{display:block;font-size:18px}.nav .on{color:var(--pink)}.lesson{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.lesson>span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#2b1735;color:var(--pink);font-weight:900}.lesson small{display:block;color:var(--muted);margin-top:4px}.miniBtn{padding:9px 11px;font-size:12px}.neck{overflow:auto;background:#120c17;border:1px solid var(--line);border-radius:16px;padding:12px}.string{min-width:650px;height:38px;border-bottom:1px solid #6b526f;display:flex;align-items:center;gap:0}.string:last-child{border:0}.string>b{width:34px;color:var(--pink)}.fret{width:70px;height:30px;border-right:1px solid #5b4262;display:grid;place-items:center;color:#9b8ba2;font-size:11px}@media(max-width:600px){.hero h1{font-size:26px}.wrap{padding-left:11px;padding-right:11px}.nav button{font-size:8px}.nav b{font-size:16px}.lesson{grid-template-columns:32px 1fr}.miniBtn{grid-column:2;justify-self:start}}</style></head><body><header class="top"><div class="head"><div class="brand"><div class="logo">♪</div><div><b>Percep-O-Musical</b><small>Curso de percepção auditiva</small></div></div><div class="xp" id="xp">⚡ 0 XP</div></div></header><main class="wrap"><div id="app"></div></main><nav class="bottom"><div class="nav"><button data-route="home"><b>⌂</b>Início</button><button data-route="modules"><b>◈</b>Módulos</button><button data-route="memory"><b>🧠</b>Memória</button><button data-route="apply"><b>◎</b>Aplicar</button><button data-route="guitar"><b>♬</b>Violão</button><button data-route="diagnostics"><b>🏆</b>Teste</button></div></nav><script src="js/app.js?v=20260910-2"></script></body></html>
