<style>
:root{--bg:#070b16;--panel:#0e1526;--panel2:#121c31;--line:#22304a;--text:#f5f7ff;--muted:#9ba9c4;--cyan:#43e7ff;--violet:#9b7bff;--green:#50e3a4;--gold:#ffd166;--red:#ff6685;--white:#fff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 20% -10%,#18265a 0,#070b16 38%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{min-height:100vh}.top{position:sticky;top:0;z-index:20;background:#070b16e8;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:14px 16px}.brand{max-width:1080px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{width:45px;height:45px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#07101c;font-size:23px;font-weight:900;box-shadow:0 0 28px #43e7ff35}.brandline{display:flex;align-items:center;gap:11px}.brand h1{font-size:17px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:2px 0}.xp{font-size:12px;color:var(--gold);font-weight:800}.wrap{max-width:1080px;margin:auto;padding:20px 15px 100px}.screen{animation:in .22s ease}@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.hero{position:relative;overflow:hidden;border:1px solid #2b3b60;border-radius:26px;padding:24px;background:linear-gradient(135deg,#101a35,#0b1120 65%);box-shadow:0 18px 60px #0005}.hero:after{content:'♪';position:absolute;right:-10px;top:-45px;font-size:180px;color:#43e7ff08;transform:rotate(12deg)}.eyebrow{color:var(--cyan);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:900}.hero h2{font-size:30px;line-height:1.05;margin:8px 0 10px;max-width:650px}.hero p{color:var(--muted);line-height:1.6;max-width:700px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.card{background:linear-gradient(180deg,#10192b,#0d1423);border:1px solid var(--line);border-radius:20px;padding:17px}.card h3{margin:0 0 7px}.card p{color:var(--muted);line-height:1.55;margin:6px 0}.path{display:flex;gap:8px;overflow:auto;padding:5px 2px 13px}.node{min-width:118px;border:1px solid var(--line);background:#0d1423;border-radius:17px;padding:13px;color:var(--text);text-align:left}.node strong{display:block;font-size:20px}.node small{color:var(--muted)}.node.on{border-color:var(--cyan);box-shadow:0 0 24px #43e7ff14}.node.lock{opacity:.48}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--muted);font-size:11px}.btn{border:0;border-radius:14px;padding:12px 16px;background:linear-gradient(135deg,var(--cyan),#70b8ff);color:#06101a;font-weight:900;box-shadow:0 8px 22px #43e7ff18}.btn.alt{background:#17233a;color:var(--text);border:1px solid #2b3b59;box-shadow:none}.btn.green{background:var(--green);color:#07160f}.btn.gold{background:var(--gold);color:#171100}.btn.danger{background:#351523;color:#ff9ab0;border:1px solid #633047}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.muted{color:var(--muted)}.section{margin:23px 0 11px}.section h2{font-size:21px;margin:0 0 7px}.bar{height:9px;border-radius:99px;background:#18243a;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));border-radius:inherit}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#0c1321;border:1px solid var(--line);border-radius:16px;padding:13px}.stat b{font-size:23px;display:block}.stat span{font-size:11px;color:var(--muted)}.lesson{line-height:1.75;color:#dbe4f7}.lesson h3{color:var(--cyan);margin-top:24px}.lesson b{color:#fff}.callout{background:#0c2030;border:1px solid #1d5366;border-left:4px solid var(--cyan);padding:14px 15px;border-radius:13px;margin:14px 0;color:#cfefff}.callout.gold{border-color:#66531f;border-left-color:var(--gold);background:#211b0b;color:#fff0bd}.exercise{background:linear-gradient(160deg,#111c32,#0b1220);border:1px solid #2b3d60;border-radius:24px;padding:21px}.exercise h3{font-size:21px;line-height:1.3}.listen{width:100%;min-height:68px;border:1px solid #31536c;background:linear-gradient(135deg,#0c2531,#101d32);color:#dffaff;border-radius:18px;font-weight:900;font-size:16px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px;margin:15px 0}.choice{border:1px solid #2a3953;background:#101a2b;color:var(--text);border-radius:15px;padding:14px 10px;font-weight:800}.choice:hover{border-color:var(--cyan);background:#13283a}.choice.good{border-color:var(--green);background:#102d25}.choice.bad{border-color:var(--red);background:#351622}.feedback{margin-top:12px;padding:14px;border-radius:14px;line-height:1.55}.ok{background:#0d2b22;border:1px solid #245f4b}.no{background:#32151f;border:1px solid #633043}.hint{color:var(--gold);font-size:12px}.tabs{display:flex;gap:7px;overflow:auto;margin:16px 0}.tabs button{white-space:nowrap}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#080d18ee;backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;justify-content:center}.bottomin{max-width:700px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}.bottom button{border:0;background:none;color:#73819b;padding:10px 4px 9px;font-size:10px}.bottom button b{display:block;font-size:18px;margin-bottom:2px}.bottom button.active{color:var(--cyan)}.tag{display:inline-block;background:#19253b;border:1px solid #2a3954;border-radius:999px;padding:5px 9px;font-size:10px;color:#b7c5dd}.meter{height:12px;border-radius:99px;background:#19253a;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));width:0}.guitar{overflow:auto;border:1px solid #4a3628;border-radius:18px;background:#1d130e;padding:10px}.neck{min-width:820px;background:linear-gradient(90deg,#744622,#b8763d,#7a4827);padding:11px;border-radius:13px}.frets{display:grid;grid-template-columns:45px repeat(12,1fr);height:245px;position:relative}.fcell{border-right:2px solid #e7d3b355;border-bottom:1px solid #e7d3b333;position:relative}.wire{position:absolute;left:45px;right:0;height:2px;background:#dbe5ea;box-shadow:0 1px 2px #0008}.dot{position:absolute;width:25px;height:25px;border-radius:50%;background:#f5f7ff;color:#172033;display:grid;place-items:center;font-size:9px;font-weight:900;z-index:2;transform:translate(-50%,-50%)}.dot.root{background:var(--cyan)}.string{background:#5b351f;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:900}.small{font-size:11px}.kbd{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}.key{min-height:72px;border:1px solid #2b3952;background:#111a2b;border-radius:10px;color:#fff;font-weight:800}.key.black{background:#050912;color:#8e9ab0}.key.active{border-color:var(--cyan);box-shadow:0 0 16px #43e7ff22}.hide{display:none!important}.footer{text-align:center;color:#66758e;font-size:11px;padding:25px 0}.streak{color:var(--gold);font-weight:900}@media(max-width:600px){.hero h2{font-size:25px}.wrap{padding:15px 12px 92px}.statgrid{grid-template-columns:repeat(3,1fr)}.stat{padding:10px 8px}.stat b{font-size:20px}.card{padding:15px}}
</style>

<body><div id="app"></div>
<script>
/* ==========================================================
   PERCEP-O-MUSICAL — REBUILD 2026
   Não é um banco de perguntas: é um percurso auditivo.
   Aprender → ouvir → praticar → diagnosticar → reforçar → testar.
   ========================================================== */
const NOTES=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const NAT=['C','D','E','F','G','A','B'];
const NAME={C:'Dó','C#':'Dó♯',D:'Ré',Eb:'Mi♭',E:'Mi',F:'Fá','F#':'Fá♯',G:'Sol',Ab:'Lá♭',A:'Lá',Bb:'Si♭',B:'Si'};
const FREQ={C:261.626,'C#':277.183,D:293.665,Eb:311.127,E:329.628,F:349.228,'F#':369.994,G:391.995,Ab:415.305,A:440,Bb:466.164,B:493.883};
const ROM=['I','♭II','II','♭III','III','IV','♯IV/♭V','V','♭VI','VI','♭VII','VII'];
const MODULES=[
 {id:1,icon:'◉',title:'O ouvido acorda',range:'01–50',color:'cyan',goal:'Construir as primeiras âncoras sonoras: altura, direção, repetição e centro.',lessons:[['01 • Escutar antes de nomear','O primeiro objetivo não é saber Dó. É perceber que dois sons podem ser diferentes e comparar qual é mais grave ou mais agudo.'],['02 • Criar uma âncora','Uma nota de referência vira um ponto de partida. Você compara o alvo com ela, em vez de tentar adivinhar do nada.'],['03 • Dar nome ao som','Depois da comparação, o nome entra como etiqueta. O ouvido vem antes do símbolo.'],['04 • Construir o mapa natural','Dó, Ré, Mi, Fá, Sol, Lá e Si entram aos poucos. O espaço entre elas também começa a fazer sentido.'],['05 • Tirar as rodinhas','A referência desaparece gradualmente. Se o ouvido não sustentar, o Coach devolve exatamente a habilidade que falhou.']]},
 {id:2,icon:'⌂',title:'Encontrar a casa',range:'51–120',color:'blue',goal:'Descobrir tônica, tonalidade, graus e relações funcionais.',lessons:[['01 • A sensação de casa','A tônica é o centro para o qual a música pode retornar. Ela não precisa aparecer primeiro.'],['02 • Graus da escala','I é casa; V cria atração; IV e ii preparam movimento. Aprenda a ouvir função, não apenas nomes.'],['03 • Maior ou menor','A terça em relação à tônica é uma das pistas principais. O contexto importa mais que uma nota isolada.'],['04 • Baixo como mapa','O baixo ajuda a revelar movimento harmônico e raízes.'],['05 • I–IV–V e ii–V–I','Progressões viram frases que o ouvido aprende a antecipar.']]},
 {id:3,icon:'↕',title:'Medir distâncias',range:'121–180',color:'violet',goal:'Intervalos, direção, contorno, memória e ditado melódico.',lessons:[['01 • Sobe ou desce?','Antes de medir, reconheça a direção.'],['02 • Tamanho relativo','Use intervalos conhecidos como referências.'],['03 • Contorno','Uma melodia pode ser entendida como sobe, desce, repete e salta.'],['04 • Ditado em camadas','Pulso → centro → contorno → chegadas → detalhes.'],['05 • Audição interna','Imagine a próxima nota antes de ouvi-la.']]},
 {id:4,icon:'♬',title:'Ler a harmonia',range:'181–260',color:'gold',goal:'Tríades, inversões, sétimas, baixo e função.',lessons:[['01 • Maior × menor','A terça muda a cor do acorde.'],['02 • O baixo separado','Identifique a nota mais grave antes de tentar decifrar o acorde inteiro.'],['03 • Inversões','A mesma harmonia pode mudar de aparência quando o baixo muda.'],['04 • Sétimas','Terça e sétima são pistas fortes para ouvir qualidade e função.'],['05 • Progressões','Reconheça padrões e antecipe o próximo acorde.']]},
 {id:5,icon:'⌁',title:'Descobrir músicas',range:'261–300',color:'red',goal:'Aplicar o ouvido a cantores, violão, capo, transposição e modulação.',lessons:[['01 • Protocolo do Tom','Casa → cantar a casa → encontrar no violão → maior/menor → confirmar.'],['02 • O cantor pode começar fora','A primeira nota pode ser III, V, VI ou outro grau. Não confunda nota inicial com tônica.'],['03 • Violão como ferramenta','Use o instrumento para confirmar uma hipótese, não para escolher aleatoriamente.'],['04 • Capo e transposição','O acorde que você segura pode não ser o tom que soa.'],['05 • Modulação','Quando a casa muda de verdade, procure o novo centro.']]},
 {id:6,icon:'★',title:'Desafio do músico',range:'301–320',color:'green',goal:'Provar que a habilidade funciona em situações misturadas.',lessons:[['01 • Sem pistas','Tudo começa pelo ouvido.'],['02 • Mistura real','Tom, graus, intervalos e acordes aparecem juntos.'],['03 • Pressão','Menos tempo e menos referências.'],['04 • Diagnóstico','O resultado mostra exatamente onde reforçar.'],['05 • Prova final','A habilidade precisa sair do exercício e entrar na música.']]}
];
let S=load();let audio=null;let current=null;let routeName='home';let lessonOpen=0;
function load(){try{return JSON.parse(localStorage.getItem('pom_rebuild_v1'))||{xp:0,streak:0,done:{},skills:{},attempts:0,correct:0,history:[]}}catch(e){return {xp:0,streak:0,done:{},skills:{},attempts:0,correct:0,history:[]}}}
function save(){localStorage.setItem('pom_rebuild_v1',JSON.stringify(S))}
function pct(){return S.attempts?Math.round(S.correct/S.attempts*100):0}
function doneCount(){return Object.keys(S.done).length}
function moduleDone(id){let [a,b]=id===1?[1,50]:id===2?[51,120]:id===3?[121,180]:id===4?[181,260]:id===5?[261,300]:[301,320];return Object.keys(S.done).filter(x=>+x>=a&&+x<=b).length}
function unlocked(id){if(id===1)return true;return moduleDone(id-1)>=Math.max(10,Math.ceil((id===2?50:MODULES[id-2].range.split('–')[1]-MODULES[id-2].range.split('–')[0]+1)*.8))||id<=1}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shell(body){document.getElementById('app').innerHTML=`<header class="top"><div class="brand"><div class="brandline"><div class="logo">♪</div><div><h1>Percep-O-Musical</h1><p>Laboratório de ouvido • aprenda a ouvir</p></div></div><div class="xp">⚡ ${S.xp} XP</div></div></header><main class="wrap"><div class="screen">${body}</div><div class="footer">Seu ouvido é treinável. O objetivo não é decorar sons isolados — é entender relações.</div></main><nav class="bottom"><div class="bottomin"><button class="${routeName==='home'?'active':''}" data-r="home"><b>⌂</b>Início</button><button class="${routeName==='path'?'active':''}" data-r="path"><b>◈</b>Curso</button><button class="${routeName==='coach'?'active':''}" data-r="coach"><b>◎</b>Coach</button><button class="${routeName==='lab'?'active':''}" data-r="lab"><b>♬</b>Laboratório</button></div></nav>`}
function go(r){routeName=r; if(r==='home')home();if(r==='path')path();if(r==='coach')coach();if(r==='lab')lab()}
function home(){let next=nextExercise();shell(`<section class="hero"><span class="eyebrow">Treinamento auditivo</span><h2>Não decore o som.<br>Aprenda a <span style="color:var(--cyan)">entendê-lo.</span></h2><p>Este projeto foi reconstruído como um curso: cada áudio ensina uma habilidade, cada erro vira diagnóstico e cada etapa prepara a próxima.</p><div class="row"><button class="btn" data-start="${next.id}">▶ Continuar treino</button><button class="btn alt" data-r="path">Ver jornada</button></div></section><div class="section"><h2>Seu painel</h2><div class="statgrid"><div class="stat"><b>${doneCount()}</b><span>desafios concluídos</span></div><div class="stat"><b>${pct()}%</b><span>precisão global</span></div><div class="stat"><b>${S.streak}🔥</b><span>sequência</span></div></div></div><div class="section"><h2>Hoje, seu ouvido precisa de…</h2>${coachCard(next)}</div><div class="section"><h2>Mapa da jornada</h2>${miniPath()}</div>`)}
function miniPath(){return `<div class="path">${MODULES.map(m=>`<button class="node ${unlocked(m.id)?'on':'lock'}" data-open="${m.id}"><strong>${m.icon}</strong><small>${m.id}. ${m.title}</small><br><span class="tag">${moduleDone(m.id)}/${m.range==='Final'?'20':m.range.split('–').map(Number).reduce((a,b)=>b-a+1)}</span></button>`).join('')}</div>`}
function path(){shell(`<div class="section"><span class="eyebrow">A jornada</span><h2>Seis territórios. Uma habilidade.</h2><p class="muted">Você não avança por quantidade. Avança quando o ouvido demonstra que a base está firme.</p></div>${MODULES.map(m=>moduleCard(m)).join('')}`)}
function moduleCard(m){let d=moduleDone(m.id),total=m.id===6?20:m.range.split('–').map(Number).reduce((a,b)=>b-a+1),u=unlocked(m.id);return `<article class="card" style="margin-bottom:12px;border-color:${u?'#29466a':'#1b263b'}"><div class="row"><span class="pill">${m.icon} VOLUME ${m.id}</span><span class="tag">${m.range}</span>${!u?'<span class="tag">🔒 base necessária</span>':''}</div><h3 style="margin-top:12px">${m.title}</h3><p>${m.goal}</p><div class="bar"><i style="width:${Math.min(100,d/total*100)}%"></i></div><p class="small">${d}/${total} experiências concluídas</p><div class="row"><button class="btn ${u?'':'alt'}" data-open="${m.id}" ${u?'':'disabled'}>${u?'Entrar no território':'Bloqueado'}</button><button class="btn alt" data-lesson="${m.id}">Estudar teoria</button></div></article>`}
function lessons(id){let m=MODULES.find(x=>x.id===id);let l=m.lessons[lessonOpen%5];shell(`<div class="section"><button class="btn alt" data-r="path">← Jornada</button><span class="tag" style="margin-left:7px">VOLUME ${id}</span><h2>${m.title}</h2></div><div class="card lesson"><span class="eyebrow">Aula ${lessonOpen%5+1} de 5</span><h2>${l[0]}</h2><p>${l[1]}</p><div class="callout"><b>Regra desta aula:</b> primeiro experimente com o ouvido, depois coloque o nome naquilo que você percebeu.</div>${lessonBody(id,lessonOpen%5)}<div class="row"><button class="btn alt" data-prev="${id}">← Aula anterior</button><button class="btn" data-next="${id}">Próxima aula →</button></div></div>`)}
function lessonBody(id,i){const texts=[['Experimento','Toque duas notas no botão abaixo. Sem olhar para o nome, diga mentalmente: a segunda subiu ou desceu?','listenTone'],['Pergunta-chave','Se eu retirar o nome da nota, ainda consigo comparar os sons? Se sim, o ouvido já está trabalhando.','compare'],['Âncora','Uma referência reduz a memória necessária. Você vai usá-la até conseguir criar uma referência interna.','anchor'],['Transferência','Depois de ouvir, tente cantar a resposta antes de conferir. Cantar transforma reconhecimento passivo em memória ativa.','sing'],['Missão','Feche os olhos. Ouça. Imagine. Responda. Depois descubra por que acertou ou errou.','mission']];let t=texts[i];return `<div class="callout gold"><b>${t[0]}:</b> ${t[1]}</div><button class="listen" data-demo="${t[2]}">🔊 Fazer o experimento</button><h3>O que observar</h3><ul><li>Qual som parece mais alto em altura?</li><li>Qual sensação permanece quando o som termina?</li><li>Você consegue cantar ou imaginar o som depois que ele some?</li></ul>`}
function nextExercise(){for(let i=1;i<=320;i++)if(!S.done[i])return exercise(i);return exercise(1+Math.floor(Math.random()*320))}
function exercise(id){if(id<=50)return basic(id);if(id<=120)return tonal(id);if(id<=180)return interval(id);if(id<=260)return harmony(id);if(id<=300)return discover(id);return finalEx(id)}
function mk(id,type,prompt,answer,choices,play,why,skill){return {id,type,prompt,answer,choices,play,why,skill}}
function basic(id){let k=id-1;if(id<=10){let pairs=[['C','G'],['C','E'],['C','F'],['C','A'],['C','D']];let p=pairs[Math.floor(k/2)],ans=k%2?p[1]:p[0];return mk(id,'Âncora',`Com a referência primeiro: qual nota apareceu no final — ${NAME[p[0]]} ou ${NAME[p[1]]}?`,ans,p,(t)=>playSeq([p[0],ans],.62,'guitar'),'Comparação com uma âncora. Você está treinando altura relativa.','altura relativa')}if(id<=20){let sets=[['C','D','G'],['C','E','G'],['C','F','G'],['C','A','G'],['D','F','A']];let s=sets[k%5],ans=s[(k+1)%3];return mk(id,'Mapa',`Qual foi o alvo entre estas três possibilidades?`,ans,s,(t)=>playSeq(s.concat(ans),.48,'guitar'),'Você amplia as escolhas sem perder a referência.','reconhecimento')}if(id<=30){let s=NAT.slice().sort(()=>Math.random()-.5).slice(0,5),ans=s[(k+2)%5];return mk(id,'Mapa',`Qual nota natural você ouviu por último?`,ans,s,(t)=>playSeq(s.concat(ans),.4,'guitar'),'Cinco possibilidades obrigam o ouvido a comparar relações mais finas.','discriminação')}if(id<=40){let ans=NAT[(k*3+1)%7];return mk(id,'Mapa',`Qual foi a nota-alvo? Agora você tem as sete notas naturais.`,ans,NAT,(t)=>playSeq(NAT.concat(ans),.34,'guitar'),'O mapa natural inteiro entra em cena.','mapa natural')}if(id<=45){let n=NAT[(k+1)%7],other=NAT[(k+3)%7];return mk(id,'Memória',`Qual nota reapareceu depois de outro som?`,n,[n,other,NAT[(k+5)%7]],(t)=>playSeq([n,other,n],.58,'guitar'),'A mesma nota precisa ser reconhecida apesar da interrupção.','memória')}if(id<=50){let a=NAT[(k+1)%7],b=NAT[(k+4)%7];return mk(id,'Sem referência',`Sem nota-guia: qual som você reconhece?`,a,[a,b,NAT[(k+5)%7]],(t)=>playSeq([a],.82,'guitar'),'A referência externa começa a desaparecer.','memória tonal')}return null}
function tonal(id){let k=id-51,root=NAT[k%7],scale=[0,2,4,5,7,9,11].map(x=>NOTES[(NOTES.indexOf(root)+x)%12]),deg=k%7,ans=scale[deg];if(id<=75)return mk(id,'Tônica',`Qual nota funciona como a casa depois desta frase?`,root,NAT,(t)=>playSeq([root,scale[4],scale[2],root],.55,'guitar'),'A frase termina no centro para treinar a sensação de resolução.','tônica');if(id<=90)return mk(id,'Grau',`Qual grau foi destacado?`,ROM[deg],ROM.slice(0,7),(t)=>playSeq([scale[0],ans],.55,'guitar'),'Você ouve a relação com a tônica, não apenas a nota absoluta.','graus');if(id<=105){let minor=k%2,third=NOTES[(NOTES.indexOf(root)+(minor?3:4))%12];return mk(id,'Maior/menor',`O centro soa maior ou menor?`,minor?'menor':'maior',['maior','menor'],(t)=>playSeq([root,third,scale[4],root],.55,'guitar'),'A terça muda a cor do centro.','maior menor')}let prog=k%2?['I','IV','V','I']:['I','V','vi','IV'];return mk(id,'Progressão',`Qual função aparece no segundo acorde?`,prog[1],[...new Set(['I','ii','IV','V','vi'])],(t)=>playProgression(root,prog),(id%2?'Ouça o movimento para dominante.':'Ouça a preparação para a resolução.'),'função harmônica')}
function interval(id){let k=id-121,a=NAT[k%7],steps=[1,2,3,4,5,6][k%6],b=NAT[(NAT.indexOf(a)+steps)%7],dir=k%2?'descendente':'ascendente';let labels=['2ª','3ª','4ª','5ª','6ª','7ª'];return mk(id,'Intervalo',`Qual intervalo foi ouvido ${dir}?`,labels[steps-1],labels,(t)=>playInterval(a,b,dir),(dir==='ascendente'?'Primeiro reconheça a direção. ':'')+'Depois associe a distância a uma referência conhecida.','intervalos')}
function harmony(id){let k=id-181,root=NAT[k%7],minor=k%3===1,third=NOTES[(NOTES.indexOf(root)+(minor?3:4))%12],fifth=NOTES[(NOTES.indexOf(root)+7)%12],quality=minor?'menor':'maior';if(id<=200)return mk(id,'Tríade',`Qual é a qualidade desta tríade?`,quality,['maior','menor','diminuta','aumentada'],(t)=>playChord(root,quality),'Ouça a terça e a sensação geral.','tríades');if(id<=220){let bass=k%3===0?root:fifth;return mk(id,'Inversão',`Qual nota está no baixo?`,NAME[bass],[NAME[root],NAME[third],NAME[fifth]],(t)=>playChord(root,quality,bass),'Separe mentalmente o baixo do bloco harmônico.','baixo');if(id<=240)return mk(id,'Sétima','Qual é a cor da sétima?','dominante',['dominante','maior','menor'],(t)=>playChord7(root),'A sétima cria uma assinatura forte de tensão.','sétimas')}let prog=k%2?['I','V','vi','IV']:['I','vi','IV','V'];return mk(id,'Harmonia',`Qual acorde fecha a progressão?`,prog[3],['I','ii','IV','V','vi'],(t)=>playProgression(root,prog),'Agora você precisa ouvir uma frase harmônica inteira.','progressões')}
function discover(id){let k=id-261,root=NOTES[(k*2)%12],first=NOTES[(NOTES.indexOf(root)+[0,4,7,9][k%4])%12];if(id<=270)return mk(id,'Tom do cantor',`O cantor começa em uma nota que NÃO é necessariamente a tônica. Qual é o centro?`,NAME[root],NOTES.map(NAME),(t)=>playSinger(root,first),'A primeira nota é uma pista melódica, não uma sentença sobre o tom.','tom de cantor');if(id<=280)return mk(id,'Tom maior/menor',`Depois de ouvir a frase, o centro é maior ou menor?`,k%2?'menor':'maior',['maior','menor'],(t)=>playSinger(root,first,k%2?'minor':'major'),'Cante a tônica mentalmente e compare a terça.','tonalidade');if(id<=290)return mk(id,'Capo',`O acorde de forma C com capo na casa 2 soa em qual tom?`,'Ré',['Dó','Ré','Mi','Sol'],(t)=>playCapo(),'A forma visual e o som real podem ser diferentes.','transposição');return mk(id,'Modulação',`Qual é a nova casa depois da mudança?`,NAME[NOTES[(NOTES.indexOf(root)+5)%12]],NOTES.map(NAME),(t)=>playModulation(root),'A nova tônica precisa persistir; uma nota isolada não basta.','modulação')}
function finalEx(id){let k=id-301,base=exercise(1+(k*13)%300);return mk(id,'Desafio',`DESAFIO FINAL: ${base.prompt}`,base.answer,base.choices,base.play,'Sem pista extra. O objetivo é transferir a habilidade para uma situação mista.','integração')}
function coachCard(e){return `<div class="card"><div class="row"><span class="pill">${e.type}</span><span class="tag">${e.skill}</span></div><h3 style="margin-top:11px">${e.prompt}</h3><p>Você não está aqui para acertar por sorte. Depois da resposta, o Coach explica o que seu ouvido deveria ter procurado.</p><button class="btn" data-start="${e.id}">Começar experiência ${String(e.id).padStart(3,'0')}</button></div>`}
function train(id){let e=exercise(id);current=e;routeName='train';let completed=doneCount();shell(`<div class="section"><button class="btn alt" data-r="home">← Sair do treino</button><div class="row" style="margin-top:12px"><span class="pill">EXPERIÊNCIA ${String(id).padStart(3,'0')} / 320</span><span class="tag">${e.type}</span><span class="tag">${e.skill}</span></div><div class="bar" style="margin-top:10px"><i style="width:${Math.min(100,completed/320*100)}%"></i></div></div><div class="exercise"><div class="eyebrow">Ouça primeiro</div><h3>${e.prompt}</h3><button class="listen" id="listen">◉ &nbsp; Ouvir áudio do desafio</button><div class="choices">${e.choices.map((c,i)=>`<button class="choice" data-answer="${i}">${esc(c)}</button>`).join('')}</div><div id="fb"></div></div><div class="card" style="margin-top:12px"><div class="row"><span class="pill">POR QUE EXISTE?</span></div><p>${e.why}</p><p class="hint">Dica de método: ${hintFor(e.skill)}</p></div>`)}
function hintFor(s){if(s.includes('tônica'))return'procure a sensação de casa antes do nome da nota';if(s.includes('interval'))return'identifique direção antes de medir';if(s.includes('harm'))return'ouça primeiro o baixo, depois a qualidade';if(s.includes('tom'))return'cante mentalmente a casa e confirme no violão';return'compare relações; não tente adivinhar pela memória visual'}
function answer(i){let e=current,choice=e.choices[i],ok=String(choice)===String(e.answer);S.attempts++;if(ok){S.correct++;S.xp+=10;S.streak++;}else{S.streak=0}S.done[e.id]=1;S.skills[e.skill]=S.skills[e.skill]||{a:0,c:0};S.skills[e.skill].a++;if(ok)S.skills[e.skill].c++;S.history.unshift({id:e.id,ok,skill:e.skill,t:Date.now()});S.history=S.history.slice(0,50);save();document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===i)b.classList.add(ok?'good':'bad');if(!ok&&String(e.choices[j])===String(e.answer))b.classList.add('good')});document.getElementById('fb').innerHTML=`<div class="feedback ${ok?'ok':'no'}"><b>${ok?'✓ Seu ouvido encontrou a resposta.':'↺ Não tem problema — este erro é informação.'}</b><br>Resposta: <b>${esc(e.answer)}</b><br><span>${e.why}</span><div class="row" style="margin-top:12px"><button class="btn" data-start="${nextForSkill(e.skill)}">Próxima missão</button><button class="btn alt" id="again">Ouvir novamente</button></div></div>`}
function nextForSkill(skill){for(let i=1;i<=320;i++)if(!S.done[i]&&exercise(i).skill===skill)return i;return nextExercise().id}
function coach(){let weakest=Object.entries(S.skills).sort((a,b)=>(a[1].c/Math.max(1,a[1].a))-(b[1].c/Math.max(1,b[1].a)))[0];let skill=weakest?weakest[0]:'altura relativa';let candidates=[];for(let i=1;i<=320;i++){let e=exercise(i);if(!S.done[i]&&e.skill===skill){candidates.push(e);if(candidates.length===3)break}}shell(`<div class="hero"><span class="eyebrow">Coach auditivo</span><h2>Seu treino muda conforme seus erros.</h2><p>O Coach não despeja 50 perguntas iguais. Ele procura a habilidade mais frágil e devolve uma missão curta para reconstruí-la.</p></div><div class="section"><h2>Diagnóstico atual</h2>${weakest?`<div class="card"><h3>${skill}</h3><div class="meter"><i style="width:${Math.round(weakest[1].c/weakest[1].a*100)}%"></i></div><p>${weakest[1].c}/${weakest[1].a} acertos neste fundamento.</p></div>`:`<div class="callout">Ainda não há dados suficientes. Faça algumas experiências para o Coach conhecer seu ouvido.</div>`}</div><div class="section"><h2>Missões recomendadas</h2><div class="grid">${(candidates.length?candidates:[nextExercise()]).map(e=>`<div class="card"><span class="pill">${e.type}</span><h3>Experiência ${String(e.id).padStart(3,'0')}</h3><p>${e.prompt}</p><button class="btn" data-start="${e.id}">Treinar</button></div>`).join('')}</div></div><div class="section"><h2>Regra do curso</h2><div class="callout gold"><b>Erro não é retrocesso.</b> É um mapa. Se você erra a mesma relação três vezes, o curso deve voltar um passo, explicar de outro jeito e só então aumentar a dificuldade.</div></div>`)}
function lab(){shell(`<div class="section"><span class="eyebrow">Ferramentas</span><h2>Laboratório do músico</h2><p class="muted">Use o som para investigar. Não para decorar diagramas.</p></div><div class="grid"><div class="card"><h3>🎸 Mapa do violão</h3><p>Escolha uma nota e veja onde ela aparece. Depois ouça a mesma nota em regiões diferentes.</p>${guitar()}</div><div class="card"><h3>⌂ Descobrir o Tom</h3><p>Um mini-protocolo para quando alguém canta uma música e você precisa encontrar a tonalidade.</p><button class="btn" data-discover="1">Abrir protocolo</button></div></div><div class="section"><h2>O protocolo dos 30 segundos</h2><div class="grid">${['1. Encontre a casa','2. Cante a casa','3. Ache no violão','4. Maior ou menor','5. Confirme I / IV / V','6. Teste a nota final'].map(x=>`<div class="card"><b>${x}</b><p class="small">Não pule para o acorde antes de localizar o centro.</p></div>`).join('')}</div></div>`)}
function guitar(){let cells='';for(let s=0;s<6;s++){cells+=`<div class="wire" style="top:${35+s*36}px"></div>`;for(let f=0;f<=12;f++){let note=NOTES[(['E','A','D','G','B','E'][s]?NOTES.indexOf(['E','A','D','G','B','E'][s]):0)+f)%12];cells+=`<div class="fcell"></div>`}}return `<div class="guitar"><div class="neck"><div class="frets">${['E','A','D','G','B','E'].map((x,i)=>`<div class="string">${x}</div>`).join('')}${cells}</div></div></div>`}
function discoverProtocol(){shell(`<div class="hero"><span class="eyebrow">Modo real</span><h2>Descobrir o tom de um cantor</h2><p>Você não precisa descobrir a primeira nota. Precisa encontrar a casa.</p><div class="callout">🎧 Ouça a frase imaginária, encontre o repouso e só depois teste notas no violão.</div><button class="btn" data-demo="mission">🔊 Ouvir frase</button></div><div class="section"><h2>Checklist</h2><div class="grid">${['A nota final parece repousar?','Consigo cantar a casa depois que o áudio termina?','O centro é maior ou menor?','I, IV ou V aparecem?','Se eu mover o capo, o som muda de tom?'].map((x,i)=>`<div class="card"><span class="pill">${i+1}</span><h3>${x}</h3></div>`).join('')}</div></div>`)}
/* ---------------- AUDIO ENGINE ---------------- */
function ac(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}
function out(){let c=ac(),g=c.createGain(),comp=c.createDynamicsCompressor();g.gain.value=.62;comp.threshold.value=-13;comp.knee.value=16;comp.ratio.value=5;comp.attack.value=.004;comp.release.value=.12;g.connect(comp).connect(c.destination);return g}
function noteHz(n,oct=4){return FREQ[n]*Math.pow(2,oct-4)}
function pluck(n,t,d=.55,kind='guitar',gain=.25){let c=ac(),o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter(),bus=out(),hz=noteHz(n);o.type=kind==='voice'?'sawtooth':'triangle';o.frequency.setValueAtTime(hz,t);if(kind==='voice'){f.type='lowpass';f.frequency.value=1800;o.connect(f).connect(g)}else o.connect(g);g.connect(bus);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.018);g.gain.exponentialRampToValueAtTime(gain*.42,t+d*.35);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.03);if(kind==='guitar'){let o2=c.createOscillator(),g2=c.createGain();o2.type='sine';o2.frequency.value=hz*2;g2.gain.setValueAtTime(.0001,t);g2.gain.exponentialRampToValueAtTime(gain*.08,t+.02);g2.gain.exponentialRampToValueAtTime(.0001,t+d*.6);o2.connect(g2).connect(bus);o2.start(t);o2.stop(t+d+.02)}}
function playSeq(seq,d=.55,kind='guitar'){let c=ac(),t=c.currentTime+.05;seq.forEach((n,i)=>pluck(n,t+i*(d+.04),d,kind,.23))}
function playInterval(a,b,dir){playSeq(dir==='descendente'?[b,a]:[a,b],.7,'guitar')}
function playChord(root,q,bass){let c=ac(),t=c.currentTime+.05,ri=NOTES.indexOf(root),third=q==='menor'?3:q==='diminuta'?3:4,fifth=q==='aumentada'?8:q==='diminuta'?6:7,arr=[root,NOTES[(ri+third)%12],NOTES[(ri+fifth)%12]];if(bass)arr.unshift(bass);arr.forEach((n,i)=>pluck(n,t+i*.055,.9,'guitar',.17))}
function playChord7(root){let ri=NOTES.indexOf(root);[root,NOTES[(ri+4)%12],NOTES[(ri+7)%12],NOTES[(ri+10)%12]].forEach((n,i)=>pluck(n,ac().currentTime+.05+i*.05,.95,'guitar',.15))}
function playProgression(root,prog){let ri=NOTES.indexOf(root),map={I:0,ii:2,iii:4,IV:5,V:7,vi:9,vii:11};prog.forEach((p,i)=>{let r=NOTES[(ri+map[p])%12];setTimeout(()=>playChord(r,'maior'),i*560)})}
function playSinger(root,first,mode='major'){let c=ac(),t=c.currentTime+.05,third=NOTES[(NOTES.indexOf(root)+(mode==='minor'?3:4))%12];[first,third,root,NOTES[(NOTES.indexOf(root)+7)%12],root].forEach((n,i)=>pluck(n,t+i*.52,.48,'voice',.18))}
function playCapo(){playSeq(['C','E','G'].map((n)=>n),.48,'guitar');setTimeout(()=>playSeq(['D','F#','A'],.48,'guitar'),1900)}
function playModulation(root){let ri=NOTES.indexOf(root),newRoot=NOTES[(ri+5)%12];playSeq([root,NOTES[(ri+7)%12],root],.48,'guitar');setTimeout(()=>playSeq([newRoot,NOTES[(NOTES.indexOf(newRoot)+7)%12],newRoot],.48,'guitar'),1800)}
function demo(kind){if(kind==='listenTone')playSeq(['C','G','E','C'],.55);else if(kind==='compare')playSeq(['C','E'],.8);else if(kind==='anchor')playSeq(['C','G','C'],.7);else if(kind==='sing')playSinger('C','E');else playProgression('C',['I','IV','V','I'])}
/* ---------------- EVENTS ---------------- */
document.addEventListener('click',e=>{let b=e.target.closest('[data-r]');if(b){go(b.dataset.r);return}b=e.target.closest('[data-start]');if(b){train(+b.dataset.start);return}b=e.target.closest('[data-open]');if(b){let id=+b.dataset.open;if(unlocked(id)){lessonOpen=0;moduleView(id)}return}b=e.target.closest('[data-lesson]');if(b){lessonOpen=0;lessons(+b.dataset.lesson);return}b=e.target.closest('[data-next]');if(b){lessonOpen++;lessons(+b.dataset.next);return}b=e.target.closest('[data-prev]');if(b){lessonOpen=Math.max(0,lessonOpen-1);lessons(+b.dataset.prev);return}b=e.target.closest('[data-answer]');if(b){answer(+b.dataset.answer);return}if(e.target.closest('#listen')&&current){current.play();return}if(e.target.closest('#again')&&current){current.play();return}b=e.target.closest('[data-demo]');if(b){demo(b.dataset.demo);return}if(e.target.closest('[data-discover]')){discoverProtocol();return}});
function moduleView(id){let m=MODULES.find(x=>x.id===id),d=moduleDone(id),total=id===6?20:m.range.split('–').map(Number).reduce((a,b)=>b-a+1);shell(`<div class="hero"><span class="eyebrow">Volume ${id} • ${m.range}</span><h2>${m.icon} ${m.title}</h2><p>${m.goal}</p><div class="bar"><i style="width:${d/total*100}%"></i></div><p class="small">${d}/${total} experiências concluídas</p><div class="row"><button class="btn" data-start="${nextInModule(id)}">▶ Continuar</button><button class="btn alt" data-lesson="${id}">📖 Aula 1</button></div></div><div class="section"><h2>Como este volume funciona</h2><div class="grid">${m.lessons.map((l,i)=>`<button class="card" style="text-align:left;color:inherit;border-color:#243653" data-lesson="${id}" onclick="lessonOpen=${i}"><span class="tag">AULA ${i+1}</span><h3>${l[0]}</h3><p>${l[1]}</p></button>`).join('')}</div></div><div class="section"><h2>Experiências</h2><div class="callout">Não são 50 perguntas soltas. São situações auditivas em que a dificuldade cresce porque uma habilidade já foi construída.</div><button class="btn" data-start="${nextInModule(id)}">Abrir próxima experiência</button></div>`)}
function nextInModule(id){let [a,b]=id===1?[1,50]:id===2?[51,120]:id===3?[121,180]:id===4?[181,260]:id===5?[261,300]:[301,320];for(let i=a;i<=b;i++)if(!S.done[i])return i;return a}
/* Corrige o clique inline da aula sem depender de estado global perdido. */
function openLesson(id,i){lessonOpen=i;lessons(id)}
/* Inicialização */
home();
</script>
</body>
</html>
