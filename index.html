<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><meta name="description" content="Percepção Musical — curso e treinador auditivo">
<title>Percep-O-Musical</title>
<style>
:root{--navy:#0f172a;--blue:#2563eb;--cyan:#0891b2;--gold:#d97706;--green:#16a34a;--red:#dc2626;--bg:#eef2f7;--card:#fff;--text:#172033;--muted:#64748b;--line:#d8e0eb;--wood:#9a6b3f;--wood2:#c28a52;--steel:#cbd5e1}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--text);background:var(--bg)}button{font:inherit;cursor:pointer}.app{min-height:100vh}.top{background:linear-gradient(135deg,#0f172a,#1d4ed8);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:10;box-shadow:0 4px 18px #0f172a35}.brand{display:flex;gap:12px;align-items:center}.logo{width:45px;height:45px;border-radius:14px;background:#ffffff18;display:grid;place-items:center;font-size:24px}.brand h1{font-size:20px;margin:0}.brand p{margin:2px 0 0;color:#dbeafe;font-size:12px}.nav{display:flex;gap:7px;overflow:auto;margin-top:14px;padding-bottom:2px}.nav button{border:0;background:#ffffff14;color:#fff;border-radius:999px;padding:9px 12px;white-space:nowrap}.nav button.active{background:#fff;color:var(--navy);font-weight:800}.wrap{max-width:1050px;margin:auto;padding:18px 15px 90px}.hero{background:linear-gradient(135deg,#fff,#eff6ff);border:1px solid #dbeafe;border-radius:22px;padding:21px;margin-bottom:15px}.hero h2{font-size:27px;margin:0 0 8px;color:var(--navy)}.hero p{margin:0;color:#475569;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 2px 8px #17255408}.card h3{margin:0 0 7px;font-size:17px}.card p{color:var(--muted);line-height:1.55;margin:6px 0}.vol{border-left:5px solid var(--blue)}.v2{border-color:#0891b2}.v3{border-color:#7c3aed}.v4{border-color:#d97706}.v5{border-color:#dc2626}.v6{border-color:#15803d}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:750;background:var(--navy);color:#fff}.btn.alt{background:#e8eef8;color:var(--navy)}.btn.green{background:#dcfce7;color:#166534}.btn.red{background:#fee2e2;color:#991b1b}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.progress{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#2563eb,#06b6d4);width:0}.stat{font-size:28px;font-weight:850;color:var(--navy)}.muted{color:var(--muted)}.section{margin:22px 0 10px}.section h2{font-size:22px;margin:0 0 9px;color:var(--navy)}.lesson{line-height:1.7}.lesson h3{color:var(--navy);margin-top:22px}.callout{background:#eff6ff;border-left:4px solid var(--blue);padding:13px 15px;border-radius:10px;margin:13px 0}.warning{background:#fff7ed;border-left-color:var(--gold)}.exercise{border:2px solid #cfe0ff;background:#fff;border-radius:20px;padding:20px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:9px;margin:15px 0}.choice{padding:13px;border:1px solid var(--line);background:#fff;border-radius:12px;text-align:left;transition:.15s}.choice:hover{border-color:var(--blue);background:#eff6ff;transform:translateY(-1px)}.choice.selected{border-color:var(--blue);background:#dbeafe}.result{padding:13px;border-radius:12px;margin-top:12px}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8eef8;color:#334155;font-size:12px;font-weight:700}.hide{display:none}.footer{text-align:center;color:#94a3b8;font-size:12px;padding:25px}.meter{height:10px;border-radius:99px;background:#e2e8f0;overflow:hidden}.meter>div{height:100%;background:#2563eb;width:0}
/* braço de violão */
.neck-wrap{overflow-x:auto;padding:8px 2px 14px}.guitar-head{min-width:760px;background:linear-gradient(90deg,#5b3a22,#8b5a32);color:#fff;border-radius:18px 18px 4px 4px;padding:14px 18px;display:flex;align-items:center;gap:15px;box-shadow:inset 0 1px #ffffff22}.guitar-head .head-name{font-weight:900;letter-spacing:.5px}.nutbar{height:52px;width:13px;background:#f4ead7;border:2px solid #8b7355;box-shadow:2px 0 4px #0003}.neck{min-width:760px;position:relative;background:linear-gradient(90deg,#8d5c35,#c58a50,#9b673d);border:2px solid #694421;border-top:0;padding:0 0 12px;border-radius:0 0 12px 12px;box-shadow:inset 0 0 25px #3d24123a}.fret-row{display:grid;grid-template-columns:54px repeat(12,1fr);height:55px;position:relative}.fret-cell{border-right:2px solid #e7d0ad55;border-bottom:1px solid #e7d0ad33;display:grid;place-items:center;position:relative}.fret-cell .wire{position:absolute;left:0;right:0;height:2px;background:#dbe4ea;box-shadow:0 1px 2px #0005}.string-label{color:#fff;font-weight:900;font-size:11px;text-align:center;background:#694421aa;height:100%;display:grid;place-items:center}.fret-num{position:absolute;bottom:-18px;font-size:10px;color:#475569;background:#fff;border-radius:5px;padding:1px 4px}.dot{width:27px;height:27px;border-radius:50%;background:#fff;color:#0f172a;display:grid;place-items:center;font-size:10px;font-weight:900;box-shadow:0 2px 4px #0005;z-index:2}.marker{position:absolute;width:9px;height:9px;border-radius:50%;background:#e7d6bd;left:50%;top:50%;transform:translate(-50%,-50%)}.string-wire{position:absolute;left:54px;right:0;height:2px;background:#e8edf0;box-shadow:0 1px 2px #0007;z-index:1}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#64748b;margin-top:25px}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:12px;height:12px;border-radius:50%;display:inline-block;background:#fff;border:1px solid #94a3b8}.legend i.root{background:#2563eb;border:0}.legend i.mark{background:#e7d6bd;border:0}
/* descoberta */
.discover-panel{background:#0f172a;color:#fff;border-radius:20px;padding:18px}.discover-panel h3{margin-top:0}.key-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.key-buttons button{border:1px solid #334155;background:#1e293b;color:#fff;border-radius:10px;padding:10px}.key-buttons button:hover{background:#334155}.small{font-size:12px}
@media(max-width:600px){.hero h2{font-size:23px}.key-buttons{grid-template-columns:repeat(3,1fr)}.wrap{padding-left:12px;padding-right:12px}}
</style>
</head>
<body><div id="app"></div>
<script>
const NOTES=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const NOTE_NAMES=['Dó','Dó♯','Ré','Mi♭','Mi','Fá','Fá♯','Sol','Lá♭','Lá','Si♭','Si'];
const FREQ={C:261.626,'C#':277.183,D:293.665,Eb:311.127,E:329.628,F:349.228,'F#':369.994,G:391.995,Ab:415.305,A:440,Bb:466.164,B:493.883};
const V=[
{id:1,title:'Fundamentos',range:'01–50',color:'v1',desc:'Altura, repouso, tensão, pulsação, timbre e centro sonoro.',lessons:[['O que é percepção musical','Percepção musical é transformar som em informação: altura, direção, distância, função e contexto.'],['Repouso e tensão','Procure a sensação de casa e de resolução. Antes de dar nomes, aprenda a sentir o centro.'],['Tônica e casa','A tônica não precisa ser a primeira nota nem a mais grave. É o centro para o qual a música tende a retornar.'],['Maior e menor','Compare especialmente a terça maior e a terça menor em relação à tônica.'],['Rotina de 15 minutos','3 min de referência; 5 min de tônica; 4 min de canto; 3 min de registro dos erros.']]},
{id:2,title:'Tonalidade e Graus',range:'51–120',color:'v2',desc:'Centro tonal, escalas, graus, notas de tendência e progressões.',lessons:[['Centro tonal','Encontre primeiro a casa; só depois dê o nome da nota.'],['Graus I–VII','I repousa; IV e ii afastam; V e vii° criam forte atração para I.'],['Solfejo móvel','Use Do como tônica da tonalidade para treinar função.'],['Maior e menor','Treine a diferença entre 3ª, 6ª e 7ª graus no contexto tonal.'],['I–IV–V e ii–V–I','Ouça primeiro o baixo, depois a qualidade e finalmente a função.']]},
{id:3,title:'Intervalos e Melodia',range:'121–180',color:'v3',desc:'Distância, direção, contorno, memória melódica, canto e ditado.',lessons:[['Intervalos','Perceba direção e tamanho antes de tentar nomear a qualidade.'],['Referências','Use relações conhecidas como âncoras e gradualmente abandone-as.'],['Contorno melódico','Pense primeiro em sobe, desce, repete e salta.'],['Ditado','Pulso → centro → contorno → chegadas → detalhes.'],['Audição interna','Antecipe mentalmente a resolução antes de conferir no instrumento.']]},
{id:4,title:'Acordes e Harmonia',range:'181–260',color:'v4',desc:'Tríades, inversões, sétimas, baixo, funções e progressões.',lessons:[['Tríades','Maior = 1–3–5; menor = 1–♭3–5; diminuta = 1–♭3–♭5; aumentada = 1–3–♯5.'],['Inversões','Ouça o baixo separadamente e depois reconecte-o ao acorde.'],['Funções','Tônica, predominante e dominante formam uma gramática.'],['Acordes com 7ª','Treine terça e sétima como guide tones.'],['Harmonia avançada','Dominantes secundários, empréstimos modais e II–V entram depois do diatônico.']]},
{id:5,title:'Descobrindo Músicas de Ouvido',range:'261–320',color:'v5',desc:'Tom de cantores, acordes, progressões, capo, transposição e modulação.',lessons:[['Protocolo de 30 segundos','Casa → cantar tônica → achar no violão → maior/menor → I/IV/V → nota final.'],['Cantor começando fora da tônica','A primeira nota pode ser III, V, VI ou outro grau.'],['Baixo como pista','Notas de chegada no baixo frequentemente revelam raízes e função.'],['Capotraste e transposição','A posição do acorde não é necessariamente o tom que soa.'],['Modulação','Quando a sensação de casa muda persistentemente, procure o novo centro.']]},
{id:6,title:'Testes Finais e Gabaritos',range:'Final',color:'v6',desc:'Desafios mistos para verificar se a habilidade está funcional.',lessons:[['Teste de tônica','Centros claros, notas iniciais enganosas e finais ambíguos.'],['Teste de intervalos','Reconhecimento ascendente e descendente.'],['Teste harmônico','Tríades, inversões, sétimas e progressões.'],['Teste de tonalidade','Encontre a casa e confirme maior/menor.'],['Desafio final','Centro, qualidade, graus, baixo, acordes e modulação.']]}
];
let state=JSON.parse(localStorage.getItem('pm_state_v2')||'{}');state.done=state.done||{};state.correct=state.correct||0;state.attempts=state.attempts||0;let ex=null;let audioCtx=null;
function save(){localStorage.setItem('pm_state_v2',JSON.stringify(state))}
function toneFreq(n,oct=4){return (FREQ[n]||261.626)*Math.pow(2,oct-4)}
function ctx(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function master(){let c=ctx(),g=c.createGain(),comp=c.createDynamicsCompressor();g.gain.value=.72;comp.threshold.value=-10;comp.knee.value=18;comp.ratio.value=5;comp.attack.value=.004;comp.release.value=.12;g.connect(comp).connect(c.destination);return g}
function voice(freq,start,dur,kind='instrument',volume=.28){let c=ctx(),out=master(),o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type=kind==='singer'?'sawtooth':'triangle';o.frequency.setValueAtTime(freq,start);if(kind==='singer'){f.type='lowpass';f.frequency.value=1900;f.Q.value=.5;o.connect(f).connect(g)}else o.connect(g);g.connect(out);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(volume,start+.025);g.gain.setValueAtTime(volume*.82,start+dur*.72);g.gain.exponentialRampToValueAtTime(.0001,start+dur);o.start(start);o.stop(start+dur+.04);if(kind==='singer'){let o2=c.createOscillator(),g2=c.createGain();o2.type='sine';o2.frequency.setValueAtTime(freq*2,start);g2.gain.setValueAtTime(.0001,start);g2.gain.exponentialRampToValueAtTime(volume*.10,start+.03);g2.gain.exponentialRampToValueAtTime(.0001,start+dur);o2.connect(g2).connect(out);o2.start(start);o2.stop(start+dur+.03)}}
function beep(n,d=.6,delay=0,kind='instrument',oct=4){let c=ctx();voice(toneFreq(n,oct),c.currentTime+delay,d,kind,.25)}
function playNotes(seq,kind='instrument'){let c=ctx(),t=c.currentTime+.05;seq.forEach(x=>{let n=x[0],d=x[1]||.5,rest=x[2]||0,oct=x[3]||4;voice(toneFreq(n,oct),t,d,kind,.22);t+=d+rest})}
function shell(active,body){document.getElementById('app').innerHTML=`<div class="app"><header class="top"><div class="brand"><div class="logo">🎵</div><div><h1>Percep-O-Musical</h1><p>Treinamento auditivo • violão • harmonia</p></div></div><nav class="nav">${[['home','🏠 Início'],['courses','📚 Cursos'],['train','🎧 Treinar'],['guitar','🎸 Violão'],['discover','🔎 Descobrir tom'],['progress','📊 Progresso']].map(x=>`<button class="${active===x[0]?'active':''}" data-route="${x[0]}">${x[1]}</button>`).join('')}</nav></header><main class="wrap">${body}</main><div class="footer">Percep-O-Musical • progresso salvo neste aparelho</div></div>`}
function route(r){if(r==='home')home();else if(r==='courses')courses();else if(r==='train')train();else if(r==='guitar')guitar();else if(r==='discover')discover();else stats()}
function home(){let p=Math.round(Object.keys(state.done).length/320*100),acc=state.attempts?Math.round(state.correct/state.attempts*100):0;shell('home',`<section class="hero"><h2>Seu ouvido é treinável. 🎧</h2><p>Um curso progressivo para aprender a encontrar a tônica, reconhecer tonalidades, intervalos, acordes e finalmente descobrir músicas de ouvido.</p><div class="row" style="margin-top:15px"><button class="btn" data-route="train">▶ Treino de hoje</button><button class="btn alt" data-route="courses">Ver curso</button></div></section><div class="grid"><div class="card"><div class="muted">Progresso</div><div class="stat">${p}%</div><div class="progress"><div class="bar" style="width:${p}%"></div></div></div><div class="card"><div class="muted">Precisão</div><div class="stat">${acc}%</div><p>${state.correct} acertos em ${state.attempts} tentativas.</p></div><div class="card"><div class="muted">Exercícios</div><div class="stat">${Object.keys(state.done).length}/320</div><p>Banco principal de treinamento.</p></div></div><div class="section"><h2>Trilha de estudo</h2></div><div class="grid">${V.map(v=>`<div class="card vol ${v.color}"><h3>📘 Volume ${v.id} — ${v.title}</h3><p>${v.desc}</p><button class="btn alt" data-volume="${v.id}">Estudar ${v.range}</button></div>`).join('')}</div>`)}
function courses(){shell('courses',`<div class="section"><h2>📚 Curso completo</h2><p class="muted">Comece pelo centro tonal e avance até a aplicação prática.</p></div><div class="grid">${V.map(v=>`<div class="card vol ${v.color}"><h3>Volume ${v.id} — ${v.title}</h3><p><b>Exercícios:</b> ${v.range}</p><p>${v.desc}</p><button class="btn" data-volume="${v.id}">Abrir volume</button></div>`).join('')}</div>`)}
function openVol(id){let v=V[id-1];shell('courses',`<button class="btn alt" data-route="courses">← Volumes</button><div class="hero" style="margin-top:13px"><h2>Volume ${v.id} — ${v.title}</h2><p>${v.desc}</p></div><div class="lesson">${v.lessons.map((l,i)=>`<div class="card"><h3>${i+1}. ${l[0]}</h3><p>${l[1]}</p>${i===0?'<div class="callout"><b>Regra de ouro:</b> primeiro ouça e cante; só depois confira no violão.</div>':''}</div>`).join('')}</div><div class="card" style="margin-top:14px"><h3>🎧 Prática do volume</h3><p>Faça exercícios e registre os erros. O objetivo é precisão e audição interna.</p><button class="btn" data-route="train">Começar exercícios</button></div>`)}
function makeExercise(){let types=['tonic','interval','chord','key'];let type=types[Math.floor(Math.random()*types.length)];let root=NOTES[Math.floor(Math.random()*12)];if(type==='tonic')return {type,answer:root,prompt:'Qual nota funciona como a “casa”?',choices:[root,...shuffle(NOTES.filter(n=>n!==root)).slice(0,5)],seq:[[root,.55],[NOTES[(NOTES.indexOf(root)+7)%12],.45,.05],[NOTES[(NOTES.indexOf(root)+4)%12],.45,.05],[root,.7]]};if(type==='interval'){let opts=[['2ª menor',1],['2ª maior',2],['3ª menor',3],['3ª maior',4],['4ª justa',5],['5ª justa',7],['6ª maior',9],['8ª justa',12]],pick=opts[Math.floor(Math.random()*opts.length)];return {type,answer:pick[0],prompt:'Qual intervalo foi ouvido?',choices:opts.map(x=>x[0]),seq:[['C',.55],[NOTES[pick[1]%12],.75]]};}if(type==='chord'){let opts=['Maior','Menor','Diminuto','Aumentado'],q=opts[Math.floor(Math.random()*opts.length)];let idx=NOTES.indexOf(root);let third=q==='Maior'?4:q==='Menor'?3:3;let fifth=q==='Diminuto'?6:q==='Aumentado'?8:7;return {type,answer:q,prompt:'Qual é a qualidade do acorde?',choices:opts,seq:[[root,.65],[NOTES[(idx+third)%12],.65,.03],[NOTES[(idx+fifth)%12],.8]]};}let mode=Math.random()<.5?'maior':'menor';return {type:'key',answer:root+' '+mode,prompt:'Qual tonalidade está sendo sugerida?',choices:[root+' '+mode,...NOTES.filter(n=>n!==root).slice(0,5).map(n=>n+' '+mode)],root,mode};}
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function playExercise(){if(!ex)return; if(ex.type==='key')playSingerPhrase(ex.root,ex.mode);else playNotes(ex.seq,ex.type==='tonic'?'instrument':'instrument')}
function playSingerPhrase(root,mode){let r=NOTES.indexOf(root);let scale=mode==='maior'?[0,2,4,5,7,9,11,12]:[0,2,3,5,7,8,10,12];let degrees=[4,2,1,3,5,3,2,1];let seq=degrees.map((d,i)=>[NOTES[(r+scale[d-1])%12],.42,i===0?.05:0,4]);playNotes(seq,'singer')}
function train(){ex=makeExercise();shell('train',`<div class="section"><h2>🎧 Treino de hoje</h2><p class="muted">Ouça sem olhar para as respostas. Depois escolha a resposta que seu ouvido indica.</p></div><div class="exercise"><div class="row"><span class="tag">${ex.type==='tonic'?'Tônica':ex.type==='interval'?'Intervalo':ex.type==='chord'?'Acorde':'Tonalidade'}</span><span class="muted">exercício novo</span></div><h3 style="font-size:22px">${ex.prompt}</h3><button class="btn" id="play-ex">🔊 Ouvir exercício</button><div class="choices">${ex.choices.map(c=>`<button class="choice answer-btn" data-answer="${encodeURIComponent(c)}">${c}</button>`).join('')}</div><div id="res"></div></div><div class="card" style="margin-top:13px"><h3>Como estudar</h3><p>1. Ouça. 2. Cante ou imagine a resposta. 3. Escolha. 4. Só depois confira no violão. 5. Se errar, repita imediatamente.</p></div>`)}
function answer(c){if(!ex)return;let ok=c===ex.answer;state.attempts++;if(ok)state.correct++;state.done['e'+Date.now()]=1;save();document.querySelectorAll('.answer-btn').forEach(b=>b.disabled=true);document.getElementById('res').innerHTML=`<div class="result ${ok?'ok':'bad'}"><b>${ok?'✅ Correto!':'❌ Ainda não.'}</b><br>Resposta: <b>${ex.answer}</b><br><span>${ok?'Muito bem. Tente o próximo sem usar o instrumento.':'Ouça novamente e procure primeiro a sensação de centro, distância ou qualidade.'}</span></div><div class="row" style="margin-top:10px"><button class="btn" data-route="train">Próximo exercício</button><button class="btn alt" id="replay">🔊 Ouvir novamente</button></div>`}
function guitar(){shell('guitar',`<div class="section"><h2>🎸 Laboratório do Violão</h2><p class="muted">Agora o braço é representado como um violão: pestana, casas, trastes, cordas, marcações e notas. Escolha uma nota para visualizar todas as ocorrências até a 12ª casa.</p></div><div class="card"><h3>Escolha a nota</h3><div class="choices">${NOTES.map(n=>`<button class="choice note-choice" data-note="${n}">${n}</button>`).join('')}</div><div id="neck-area"><div class="callout">Escolha uma nota para destacar suas posições no braço.</div></div></div><div class="callout"><b>Exercício:</b> cante uma nota, escolha-a e tente encontrar uma posição sem olhar para o desenho. Depois confira.</div>`)}
function showNote(n){let open=['E','A','D','G','B','E'],openIdx={E:4,A:9,D:2,G:7,B:11},html='<div class="neck-wrap"><div class="guitar-head"><span class="head-name">VIOLÃO • AFINAÇÃO PADRÃO</span><span class="small">E A D G B E</span></div><div class="neck">';for(let s=0;s<6;s++){let o=open[s];html+=`<div class="fret-row"><div class="string-label">${o}</div>`;for(let f=1;f<=12;f++){let note=NOTES[(openIdx[o]+f)%12],is=note===n;let marker=[3,5,7,9].includes(f)?'<span class="marker"></span>':(f===12?'<span class="marker"></span><span class="marker" style="margin-top:22px"></span>':'');html+=`<div class="fret-cell">${marker}${is?`<span class="dot" style="background:#2563eb;color:#fff">${note}</span>`:''}<span class="fret-num">${f}</span><span class="wire" style="top:${s*9+7}px"></span></div>`}html+='</div>'}html+=`</div></div><div class="legend"><span><i class="root"></i> nota escolhida</span><span><i class="mark"></i> marcação da casa</span><span>Afinação: E–A–D–G–B–E</span></div><div class="row" style="margin-top:14px"><span class="tag">Nota: ${n}</span><button class="btn alt" id="play-note">🔊 Ouvir ${n}</button></div>`;document.getElementById('neck-area').innerHTML=html;beep(n,.75)}
function discover(){shell('discover',`<section class="hero"><h2>🔎 Descobrir o Tom</h2><p>Este modo agora é um exercício de verdade: o app toca uma pequena frase com timbre de voz, podendo começar em um grau diferente da tônica. Sua missão é descobrir a tonalidade.</p></section><div class="discover-panel"><h3>🎤 Desafio do cantor</h3><p class="small" style="color:#cbd5e1">A primeira nota não é necessariamente a tônica. Ouça a frase, encontre mentalmente a “casa” e escolha o tom.</p><button class="btn" id="play-discover">▶ Ouvir frase</button><div id="discover-answer" style="margin-top:16px"></div></div><div class="card" style="margin-top:14px"><h3>Protocolo profissional</h3><ol><li>Ouça a frase inteira.</li><li>Procure a sensação de repouso.</li><li>Cante a nota-casa.</li><li>Encontre-a no violão.</li><li>Teste maior/menor.</li><li>Confirme com a nota final e I–IV–V.</li></ol><div class="callout warning"><b>Armadilha:</b> a primeira nota pode ser III, V, VI ou outro grau.</div></div>`)}
let disc=null;
function newDiscover(){let root=NOTES[Math.floor(Math.random()*12)],mode=Math.random()<.55?'maior':'menor';disc={root,mode};let r=NOTES.indexOf(root);let scale=mode==='maior'?[0,2,4,5,7,9,11,12]:[0,2,3,5,7,8,10,12];let deg=[3,5,2,4,1,5,3,1];disc.seq=deg.map((d,i)=>[NOTES[(r+scale[d-1])%12],.44,i===0?.05:0]);playNotes(disc.seq,'singer');let opts=[root+' '+mode,...shuffle(NOTES.filter(n=>n!==root)).slice(0,7).map(n=>n+' '+mode)];document.getElementById('discover-answer').innerHTML=`<div class="key-buttons">${opts.map(x=>`<button class="disc-answer" data-answer="${x}">${x}</button>`).join('')}</div><div id="disc-result"></div>`}
function stats(){let pct=state.attempts?Math.round(state.correct/state.attempts*100):0;shell('progress',`<div class="section"><h2>📊 Seu progresso</h2></div><div class="grid"><div class="card"><div class="muted">Exercícios</div><div class="stat">${Object.keys(state.done).length}</div></div><div class="card"><div class="muted">Precisão</div><div class="stat">${pct}%</div></div><div class="card"><div class="muted">Tentativas</div><div class="stat">${state.attempts}</div></div></div><div class="card" style="margin-top:13px"><h3>Próximo foco</h3><p>${pct<60?'Volte a tônica, repouso e maior/menor.':pct<80?'Treine graus e intervalos.':'Aumente a dificuldade e foque em harmonia e tom.'}</p><div class="progress"><div class="bar" style="width:${Math.min(pct,100)}%"></div></div></div><div class="card" style="margin-top:13px"><h3>🔄 Reiniciar progresso</h3><button class="btn red" id="reset">Apagar progresso</button></div>`)}

document.addEventListener('click',e=>{let r=e.target.closest('[data-route]');if(r){route(r.dataset.route);return}let v=e.target.closest('[data-volume]');if(v){openVol(+v.dataset.volume);return}let a=e.target.closest('.answer-btn');if(a){answer(decodeURIComponent(a.dataset.answer));return}if(e.target.id==='play-ex'){playExercise();return}if(e.target.id==='replay'){playExercise();return}let nc=e.target.closest('.note-choice');if(nc){showNote(nc.dataset.note);return}if(e.target.id==='play-note'){let n=document.querySelector('#neck-area .tag')?.textContent?.replace('Nota: ','').trim();if(n)beep(n,.75);return}if(e.target.id==='play-discover'){newDiscover();return}let da=e.target.closest('.disc-answer');if(da&&disc){let ok=da.dataset.answer===disc.root+' '+disc.mode;state.attempts++;if(ok)state.correct++;state.done['d'+Date.now()]=1;save();document.querySelectorAll('.disc-answer').forEach(b=>b.disabled=true);document.getElementById('disc-result').innerHTML=`<div class="result ${ok?'ok':'bad'}" style="margin-top:12px"><b>${ok?'✅ Acertou!':'❌ Não foi dessa vez.'}</b><br>Tom correto: <b>${disc.root} ${disc.mode}</b><br><span>${ok?'Você encontrou o centro tonal.':'Repita a frase e tente cantar a nota que dá sensação de chegada.'}</span></div>`;return}if(e.target.id==='reset'){if(confirm('Apagar todo o progresso deste aparelho?')){localStorage.removeItem('pm_state_v2');location.reload()}}});
route('home');
</script><script src="memory-test.js"></script><script src="module1-training.js"></script><script src="module1-gate.js"></script><script src="course-structure.js"></script></body></html>
